      Tags:
        Name:
          Fn::Sub:
          - ${AWS::StackName}${postfix}-node
          - postfix:
              Ref: Postfix
        datagrok.component: datagrok
    Type: AWS::EKS::Nodegroup
  EKSNodeRole:
    Condition: CreateCluster
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
      - Key: datagrok.component
        Value: datagrok
    Type: AWS::IAM::Role
  GrokPipeApiKeySecret:
    Properties:
      Description: Automatically generated API key for Datagrok
      GenerateSecretString:
        ExcludeCharacters: '"@/\!#$%^&*()-_=+[]{}|;:,.<>?`~'
        GenerateStringKey: apikey
        PasswordLength: 32
        SecretStringTemplate: '{"apikey": ""}'
      Name:
        Fn::Sub: ${AWS::StackName}-GrokPipeApiKey
    Type: AWS::SecretsManager::Secret
  GrokRegistryProxyECRPolicy:
    Condition: RegistryProxyEnabled
    Properties:
      Description:
        Fn::Sub: ${AWS::StackName} Registry Proxy ECR policy
      ManagedPolicyName:
        Fn::Sub: ${AWS::StackName}-RegistryProxy-ECR-${AWS::Region}
      PolicyDocument:
        Statement:
        - Action:
          - ecr:GetAuthorizationToken
          Effect: Allow
          Resource: '*'
        - Action:
          - ecr:BatchCheckLayerAvailability
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer
          - ecr:CompleteLayerUpload
          - ecr:UploadLayerPart
          - ecr:InitiateLayerUpload
          - ecr:PutImage
          - ecr:DescribeRepositories
          - ecr:ListImages
          - ecr:CreateRepository
          - ecr:TagResource
          Effect: Allow
          Resource:
            Fn::Sub: arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/datagrok/*
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  InstallerAccessEntry:
    Properties:
      AccessPolicies:
      - AccessScope:
          Type: cluster
        PolicyArn:
          Fn::Sub: arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      ClusterName:
        Fn::GetAtt:
        - EKSClusterInfo
        - ClusterName
      PrincipalArn:
        Fn::GetAtt:
        - InstallerRole
        - Arn
    Type: AWS::EKS::AccessEntry
  InstallerClusterIngress:
    Properties:
      Description:
        Fn::Sub: ${AWS::StackName} Allow the Datagrok installer to reach the Kubernetes
          API
      FromPort: 443
      GroupId:
        Fn::GetAtt:
        - EKSClusterInfo
        - ClusterSecurityGroupId
      IpProtocol: TCP
      SourceSecurityGroupId:
        Ref: InstallerSecurityGroup
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  InstallerLogGroup:
    DeletionPolicy: Delete
    Properties:
      LogGroupName:
        Fn::Sub:
        - /aws/codebuild/${AWS::StackName}${postfix}-installer
        - postfix:
            Ref: Postfix
      RetentionInDays: 14
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
  InstallerProject:
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      Description: Installs Datagrok on EKS with Helm for CloudFormation
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        Type: LINUX_CONTAINER
      LogsConfig:
        CloudWatchLogs:
          GroupName:
            Ref: InstallerLogGroup
          Status: ENABLED
      ServiceRole:
        Fn::GetAtt:
        - InstallerRole
        - Arn
      Source:
        BuildSpec: "version: 0.2\nenv:\n  shell: bash\nphases:\n  build:\n    commands:\n\
          \      - command -v jq > /dev/null || dnf install -y -q jq\n      - |\n\
          \        cat > /tmp/install.sh <<'SCRIPT'\n        set -euo pipefail\n \
          \       request_type=$(jq -r .RequestType <<< \"$CFN_EVENT\")\n        echo\
          \ \"$request_type Datagrok on $ClusterName/$Namespace\"\n\n        curl\
          \ -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz -C\
          \ /tmp\n        install /tmp/linux-amd64/helm /usr/local/bin/helm\n    \
          \    curl -fsSLo /usr/local/bin/kubectl \"https://dl.k8s.io/release/$(curl\
          \ -fsSL https://dl.k8s.io/release/stable-1.35.txt)/bin/linux/amd64/kubectl\"\
          \n        chmod +x /usr/local/bin/kubectl\n        aws eks update-kubeconfig\
          \ --name \"$ClusterName\" --region \"$AWS_REGION\"\n\n        if [ \"$request_type\"\
          \ = Delete ]; then\n          kubectl -n \"$Namespace\" delete targetgroupbindings.elbv2.k8s.aws\
          \ --all --ignore-not-found --timeout=5m || true\n          helm uninstall\
          \ datagrok -n \"$Namespace\" --wait --timeout 10m || true\n          kubectl\
          \ delete namespace \"$Namespace\" --ignore-not-found --timeout=10m || true\n\
          \          exit 0\n        fi\n\n        if [ -z \"$(kubectl get deploy\
          \ -A -l app.kubernetes.io/name=aws-load-balancer-controller -o name)\" ];\
          \ then\n          helm upgrade --install aws-load-balancer-controller aws-load-balancer-controller\
          \ \\\n            --repo https://aws.github.io/eks-charts -n kube-system\
          \ --wait --timeout 10m \\\n            --set clusterName=\"$ClusterName\"\
          \ --set region=\"$AWS_REGION\" --set vpcId=\"$VpcId\" \\\n            --set\
          \ serviceAccount.name=aws-load-balancer-controller \\\n            --set-string\
          \ serviceAccount.annotations.eks\\\\.amazonaws\\\\.com/role-arn=\"$LoadBalancerControllerRoleArn\"\
          \ \\\n            --set enableServiceMutatorWebhook=false\n        fi\n\
          \        if [ \"$GpuEnabled\" = true ] && [ -z \"$(kubectl get ds -A -l\
          \ app.kubernetes.io/name=nvidia-device-plugin -o name)\" ]; then\n     \
          \     helm upgrade --install nvidia-device-plugin nvidia-device-plugin \\\
          \n            --repo https://nvidia.github.io/k8s-device-plugin -n kube-system\
          \ --wait --timeout 10m\n        fi\n\n        secret() { aws secretsmanager\
          \ get-secret-value --secret-id \"$1\" --query SecretString --output text\
          \ | jq -r \".$2\"; }\n        pipe_key=$(secret \"$GrokPipeApiKeySecret\"\
          \ apikey)\n        # DB passwords go through secretRefs: published charts\
          \ drop an inline adminPassword for an external DB.\n        kubectl create\
          \ namespace \"$Namespace\" --dry-run=client -o yaml | kubectl apply -f -\n\
          \        jq -n --arg ns \"$Namespace\" --arg password \"$(secret \"$DbUserSecret\"\
          \ password)\" \\\n          --arg admin_password \"$(secret \"$DbAdminSecret\"\
          \ password)\" \\\n          '{apiVersion: \"v1\", kind: \"Secret\", metadata:\
          \ {name: \"datagrok-db\", namespace: $ns},\n            stringData: {password:\
          \ $password, adminPassword: $admin_password}}' | kubectl apply -f -\n  \
          \      jq -n \\\n          --arg db_host \"$DbHost\" --arg db_port \"$DbPort\"\
          \ --arg bucket \"$Bucket\" --arg region \"$AWS_REGION\" \\\n          --arg\
          \ db_user \"$(secret \"$DbUserSecret\" user)\" --arg db_admin \"$(secret\
          \ \"$DbAdminSecret\" user)\" \\\n          --arg admin_password \"$(secret\
          \ \"$AdminPasswordSecret\" password)\" \\\n          --arg dev_key \"$(secret\
          \ \"$AdminDevKeySecret\" password)\" \\\n          --arg rabbitmq_password\
          \ \"$(secret \"$RabbitMQPasswordSecret\" password)\" \\\n          --arg\
          \ pipe_key \"$pipe_key\" --arg spawner_key \"$(sha256sum <<< \"spawner:$pipe_key\"\
          \ | cut -c1-32)\" \\\n          --arg sa_role \"$ServiceAccountRoleArn\"\
          \ --arg registry \"$RegistryProxyEnabled\" \\\n          --arg ecr \"https://$AccountId.dkr.ecr.$AWS_REGION.amazonaws.com\"\
          \ \\\n          --arg datagrok \"$DatagrokImage\" --arg datagrok_tag \"\
          $DatagrokVersion\" \\\n          --arg grok_connect \"$GrokConnectImage\"\
          \ --arg grok_connect_tag \"$GrokConnectVersion\" \\\n          --arg grok_pipe\
          \ \"$GrokPipeImage\" --arg grok_pipe_tag \"$GrokPipeVersion\" \\\n     \
          \     --arg rabbitmq \"$RabbitmqImage\" --arg rabbitmq_tag \"$RabbitmqVersion\"\
          \ \\\n          --arg spawner \"$GrokSpawnerImage\" --arg spawner_tag \"\
          $GrokSpawnerVersion\" \\\n          --arg registry_proxy \"$GrokRegistryProxyImage\"\
          \ --arg registry_proxy_tag \"$GrokRegistryProxyVersion\" \\\n          --arg\
          \ jkg \"$JKGImage\" --arg jkg_tag \"$JKGVersion\" \\\n          '{\n   \
          \         datagrok: {image: {repository: $datagrok, tag: $datagrok_tag},\
          \ grokMode: \"auto\",\n              adminPassword: $admin_password, grokParametersExtra:\
          \ {adminDevKey: $dev_key}},\n            postgres: {internal: false, external:\
          \ {host: $db_host, port: ($db_port | tonumber), ssl: true},\n          \
          \    database: \"datagrok\", user: $db_user, adminUser: $db_admin,\n   \
          \           secretRefs: {password: {name: \"datagrok-db\", key: \"password\"\
          },\n                adminPassword: {name: \"datagrok-db\", key: \"adminPassword\"\
          }}},\n            storage: {type: \"s3\", s3: {bucket: $bucket, region:\
          \ $region}},\n            rabbitmq: {image: {repository: $rabbitmq, tag:\
          \ $rabbitmq_tag}, password: $rabbitmq_password},\n            grokPipe:\
          \ {image: {repository: $grok_pipe, tag: $grok_pipe_tag}, apiKey: $pipe_key},\n\
          \            spawner: {image: {repository: $spawner, tag: $spawner_tag},\
          \ apiKey: $spawner_key},\n            grokConnect: {image: {repository:\
          \ $grok_connect, tag: $grok_connect_tag}},\n            grokConnectAdbc:\
          \ {enabled: false},\n            jkg: {image: {repository: $jkg, tag: $jkg_tag}},\n\
          \            registry: (if $registry == \"true\"\n              then {type:\
          \ \"proxy\", proxy: {image: {repository: $registry_proxy, tag: $registry_proxy_tag},\
          \ backendUrl: $ecr}}\n              else {type: \"none\"} end),\n      \
          \      ingress: {enabled: false},\n            serviceAccount: {create:\
          \ true, annotations: {\"eks.amazonaws.com/role-arn\": $sa_role}}\n     \
          \     }' > /tmp/values.json\n\n        helm upgrade --install datagrok oci://registry-1.docker.io/datagrok/datagrok\
          \ \\\n          --version \"$ChartVersion-helm\" -n \"$Namespace\" --create-namespace\
          \ -f /tmp/values.json\n        if [ \"$RegistryProxyEnabled\" = true ];\
          \ then\n          kubectl -n \"$Namespace\" set env deploy/datagrok-registry-proxy\
          \ ECR_MODE=true AWS_REGION=\"$AWS_REGION\"\n          kubectl -n \"$Namespace\"\
          \ patch deploy datagrok-registry-proxy \\\n            -p '{\"spec\":{\"\
          template\":{\"spec\":{\"serviceAccountName\":\"datagrok\"}}}}'\n       \
          \ fi\n        kubectl -n \"$Namespace\" rollout status deploy/datagrok --timeout=40m\n\
          \n        # The binding takes the target group over, so it is applied only\
          \ once Datagrok is ready.\n        bind() {\n          printf '{\"apiVersion\"\
          :\"elbv2.k8s.aws/v1beta1\",\"kind\":\"TargetGroupBinding\",\"metadata\"\
          :{\"name\":\"%s\",\"namespace\":\"%s\"},\"spec\":{\"serviceRef\":{\"name\"\
          :\"%s\",\"port\":%s},\"targetGroupARN\":\"%s\",\"targetType\":\"ip\"}}'\
          \ \\\n            \"$1\" \"$Namespace\" \"$1\" \"$2\" \"$3\" > /tmp/tgb.json\n\
          \          for i in $(seq 30); do kubectl apply -f /tmp/tgb.json && return\
          \ 0; sleep 10; done\n          return 1\n        }\n        bind datagrok\
          \ 80 \"$TargetGroupArn\"\n        [ \"$RegistryProxyEnabled\" = true ] &&\
          \ bind datagrok-registry-proxy 5000 \"$RegistryTargetGroupArn\"\n      \
          \  for i in $(seq 90); do\n          state=$(aws elbv2 describe-target-health\
          \ --target-group-arn \"$TargetGroupArn\" \\\n            --query 'TargetHealthDescriptions[].TargetHealth.State'\
          \ --output text)\n          echo \"Target group: $state\"\n          [[\
          \ \"$state\" == *healthy* && \"$state\" != *unhealthy* ]] && exit 0\n  \
          \        sleep 20\n        done\n        echo \"Datagrok did not become\
          \ healthy behind the load balancer\"\n        exit 1\n        SCRIPT\n \
          \     - bash /tmp/install.sh\n  post_build:\n    commands:\n      - |\n\
          \        status=SUCCESS\n        reason=\"See CodeBuild log $CODEBUILD_BUILD_ID\"\
          \n        if [ \"$CODEBUILD_BUILD_SUCCEEDING\" != 1 ] && [ \"$(jq -r .RequestType\
          \ <<< \"$CFN_EVENT\")\" != Delete ]; then\n          status=FAILED\n   \
          \       reason=\"Datagrok installation failed. See CodeBuild log $CODEBUILD_BUILD_ID\"\
          \n        fi\n        jq -n --arg status \"$status\" --arg reason \"$reason\"\
          \ --arg physical \"$ClusterName/$Namespace/datagrok\" \\\n          --argjson\
          \ event \"$CFN_EVENT\" \\\n          '{Status: $status, Reason: $reason,\
          \ PhysicalResourceId: $physical, StackId: $event.StackId,\n            RequestId:\
          \ $event.RequestId, LogicalResourceId: $event.LogicalResourceId, Data: {}}'\
          \ > /tmp/response.json\n        curl -fsS -X PUT -H 'Content-Type:' --data-binary\
          \ @/tmp/response.json \"$(jq -r .ResponseURL <<< \"$CFN_EVENT\")\"\n"
        Type: NO_SOURCE
      Tags:
      - Key: datagrok.component
        Value: datagrok
      TimeoutInMinutes: 60
      VpcConfig:
        SecurityGroupIds:
        - Ref: InstallerSecurityGroup
        Subnets:
        - Ref: DatagrokPrivateSubnet1
        - Ref: DatagrokPrivateSubnet2
        VpcId:
          Ref: DatagrokVPC
    Type: AWS::CodeBuild::Project
  InstallerRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
              Fn::Sub: ${InstallerLogGroup.Arn}
          - Action: eks:DescribeCluster
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/*
          - Action: secretsmanager:GetSecretValue
            Effect: Allow
            Resource:
            - Ref: DatagrokDbUser
            - Ref: DatagrokDbAdminUser
            - Ref: DatagrokAdminPassword
            - Ref: DatagrokAdminDevKey
            - Ref: RabbitMQPassword
            - Ref: GrokPipeApiKeySecret
          - Action: elasticloadbalancing:DescribeTargetHealth
            Effect: Allow
            Resource: '*'
          - Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeDhcpOptions
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:DescribeSubnets
            - ec2:DescribeSecurityGroups
            - ec2:DescribeVpcs
            Effect: Allow
            Resource: '*'
          - Action: ec2:CreateNetworkInterfacePermission
            Condition:
              StringEquals:
                ec2:AuthorizedService: codebuild.amazonaws.com
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
          Version: '2012-10-17'
        PolicyName: datagrok-installer
      Tags:
      - Key: datagrok.component
        Value: datagrok
    Type: AWS::IAM::Role
  InstallerSecurityGroup:
    Properties:
      GroupDescription:
        Fn::Sub: ${AWS::StackName} Datagrok EKS installer
      Tags:
      - Key: Name
        Value:
          Fn::Sub:
          - ${AWS::StackName}${postfix}-installer
          - postfix:
              Ref: Postfix
      - Key: datagrok.component
        Value: datagrok
      VpcId:
        Ref: DatagrokVPC
    Type: AWS::EC2::SecurityGroup
  InstallerTriggerFunction:
    Properties:
      Code:
        ZipFile: "import json\nimport os\nimport boto3\nimport cfnresponse\n\n\ndef\
          \ handler(event, context):\n    props = event['ResourceProperties']\n  \
          \  physical = event.get('PhysicalResourceId', 'none')\n    try:\n      \
          \  if event['RequestType'] == 'Delete' and props.get('ClusterOwned') ==\
          \ 'true':\n            # The cluster goes away with the stack, so there\
          \ is nothing to uninstall.\n            stack = boto3.client('cloudformation').describe_stacks(StackName=event['StackId'])['Stacks'][0]\n\
          \            if stack['StackStatus'] == 'DELETE_IN_PROGRESS':\n        \
          \        cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical)\n\
          \                return\n        request = {k: event.get(k) for k in\n \
          \                  ['RequestType', 'ResponseURL', 'StackId', 'RequestId',\
          \ 'LogicalResourceId', 'PhysicalResourceId']}\n        env = [{'name': k,\
          \ 'value': str(v), 'type': 'PLAINTEXT'} for k, v in props.items() if k !=\
          \ 'ServiceToken']\n        env.append({'name': 'CFN_EVENT', 'value': json.dumps(request),\
          \ 'type': 'PLAINTEXT'})\n        build = boto3.client('codebuild').start_build(projectName=os.environ['PROJECT'],\
          \ environmentVariablesOverride=env)\n        print('Started', build['build']['id'])\n\
          \    except Exception as e:\n        print(type(e).__name__, e)\n      \
          \  status = cfnresponse.SUCCESS if event['RequestType'] == 'Delete' else\
          \ cfnresponse.FAILED\n        cfnresponse.send(event, context, status, {},\
          \ physical, reason=str(e)[:500])\n"
      Description: Starts the Datagrok EKS installer build for a CloudFormation request
      Environment:
        Variables:
          PROJECT:
            Ref: InstallerProject
      Handler: index.handler
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - InstallerTriggerRole
        - Arn
      Runtime: python3.13
      Timeout: 60
    Type: AWS::Lambda::Function
  InstallerTriggerLogGroup:
    DeletionPolicy: Delete
    Properties:
      LogGroupName:
        Fn::Sub:
        - /aws/lambda/${function_name}
        - function_name:
            Ref: InstallerTriggerFunction
      RetentionInDays: 7
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
  InstallerTriggerRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
          - Action: codebuild:StartBuild
            Effect: Allow
            Resource:
              Fn::GetAtt:
              - InstallerProject
              - Arn
          - Action: cloudformation:DescribeStacks
            Effect: Allow
            Resource:
              Ref: AWS::StackId
          Version: '2012-10-17'
        PolicyName: datagrok-installer-trigger
    Type: AWS::IAM::Role
  LoadBalancerControllerRole:
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub:
        - "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\"\
          : \"Allow\",\n    \"Principal\": {\"Federated\": \"${provider}\"},\n   \
          \ \"Action\": \"sts:AssumeRoleWithWebIdentity\",\n    \"Condition\": {\n\
          \      \"StringEquals\": {\n        \"${issuer}:aud\": \"sts.amazonaws.com\"\
          ,\n        \"${issuer}:sub\": \"system:serviceaccount:kube-system:aws-load-balancer-controller\"\
          \n      }\n    }\n  }]\n}\n"
        - issuer:
            Fn::GetAtt:
            - EKSClusterInfo
            - OIDCIssuerHost
          provider:
            Fn::GetAtt:
            - EKSClusterInfo
            - OIDCProviderArn
      Policies:
      - PolicyDocument:
          Statement:
          - Action:
            - ec2:Describe*
            - elasticloadbalancing:Describe*
            Effect: Allow
            Resource: '*'
          - Action:
            - elasticloadbalancing:RegisterTargets
            - elasticloadbalancing:DeregisterTargets
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*
          Version: '2012-10-17'
        PolicyName: target-group-binding
      Tags:
      - Key: datagrok.component
        Value: datagrok
    Type: AWS::IAM::Role
  RabbitMQPassword:
    Properties:
      Description: Automatically generated RabbitMQ password
      GenerateSecretString:
        ExcludeCharacters: '"@/\!#$%^&*()-_=+[]{}|;:,.<>?`~'
        GenerateStringKey: password
        PasswordLength: 16
        SecretStringTemplate: '{"password": "password"}'
    Type: AWS::SecretsManager::Secret
  RegistryProxyListenerRule:
    Condition: RegistryProxyEnabled
    Properties:
      Actions:
      - TargetGroupArn:
          Ref: DatagrokTCP5000ExtTargetGroup
        Type: forward
      Conditions:
      - Field: host-header
        HostHeaderConfig:
          Values:
          - registry.*
      ListenerArn:
        Ref: DatagrokTCP443Listener
      Priority: 10
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
Rules:
  InternetIngressAccess:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: DatagrokPublicSubnet1
          - Ref: DatagrokPrivateSubnet1
      AssertDescription: Separate public and private subnets must be specified for
        access from internet (DatagrokPublicSubnet1 and DatagrokPrivateSubnet1 match)
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: DatagrokPublicSubnet2
          - Ref: DatagrokPrivateSubnet2
      AssertDescription: Separate public and private subnets must be specified for
        access from internet (DatagrokPublicSubnet2 and DatagrokPrivateSubnet2 match)
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: DatagrokPublicSubnet1
          - Ref: DatagrokPrivateSubnet2
      AssertDescription: Separate public and private subnets must be specified for
        access from internet (DatagrokPublicSubnet2 and DatagrokPrivateSubnet2 match)
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: DatagrokPublicSubnet2
          - Ref: DatagrokPrivateSubnet1
      AssertDescription: Separate public and private subnets must be specified for
        access from internet (DatagrokPublicSubnet2 and DatagrokPrivateSubnet1 match)
    RuleCondition:
      Fn::Equals:
      - Ref: InternetIngressAccess
      - 'true'
  InternetSubnetAllow:
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: InternetSubnetAllow
          - Ref: InternetSubnetAllow2
      AssertDescription: Subnets for access to Datagrok client endpoints must be unique
        (InternetSubnetAllow and InternetSubnetAllow2 match)
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: InternetSubnetAllow
          - Ref: InternetSubnetAllow3
      AssertDescription: Subnets for access to Datagrok client endpoints must be unique
        (InternetSubnetAllow and InternetSubnetAllow3 match)
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: InternetSubnetAllow2
          - Ref: InternetSubnetAllow3
      AssertDescription: Subnets for access to Datagrok client endpoints must be unique
        (InternetSubnetAllow2 and InternetSubnetAllow3 match)
    RuleCondition:
      Fn::Or:
      - Fn::Not:
        - Fn::Equals:
          - Ref: InternetSubnetAllow2
          - ''
      - Fn::Not:
        - Fn::Equals:
          - Ref: InternetSubnetAllow3
          - ''
  SubnetsInVPC:
    Assertions:
    - Assert:
        Fn::EachMemberEquals:
        - - Fn::ValueOf:
            - DatagrokPublicSubnet1
            - VpcId
          - Fn::ValueOf:
            - DatagrokPublicSubnet2
            - VpcId
          - Fn::ValueOf:
            - DatagrokPrivateSubnet1
            - VpcId
          - Fn::ValueOf:
            - DatagrokPrivateSubnet2
            - VpcId
          - Fn::ValueOf:
            - DatagrokDataSubnet1
            - VpcId
          - Fn::ValueOf:
            - DatagrokDataSubnet2
            - VpcId
