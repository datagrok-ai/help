    Type: AWS::IAM::Role
  EKSClusterRole:
    Condition: CreateCluster
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: eks.amazonaws.com
