---
AWSTemplateFormatVersion: '2010-09-09'
Conditions:
  AccessFromInternetSubnetAllow2:
    Fn::Not:
    - Fn::Equals:
      - Ref: InternetSubnetAllow2
      - ''
  AccessFromInternetSubnetAllow3:
    Fn::Not:
    - Fn::Equals:
      - Ref: InternetSubnetAllow3
      - ''
  AccessFromNatGW:
    Fn::And:
    - Condition: InternetIngressAccess
    - Condition: InternetEgressAccess
  CreateCluster:
    Fn::Equals:
    - Ref: ExistingEksClusterName
    - ''
  CreateGpuNodeGroup:
    Fn::And:
    - Condition: CreateCluster
    - Condition: GpuRequired
  CreateVPC:
    Fn::Equals:
    - choose
    - create
  GpuRequired:
    Fn::Equals:
    - Ref: GpuRequired
    - 'true'
  InternetEgressAccess:
    Fn::Equals:
    - 'true'
    - 'true'
  InternetIngressAccess:
    Fn::Equals:
    - Ref: InternetIngressAccess
    - 'true'
  RegistryProxyEnabled:
    Fn::Equals:
    - Ref: EnableRegistryProxy
    - 'true'
  RestoreFromSnapshot:
    Fn::Not:
    - Fn::Equals:
      - Ref: DBSnapshotIdentifier
      - ''
  UseChartVersionOverride:
    Fn::Not:
    - Fn::Equals:
      - Ref: HelmChartVersion
      - ''
  UseVPCEndpoint:
    Fn::Not:
    - Fn::Equals:
      - Ref: DatagrokS3VPCEndpoint
      - ''
Description: Datagrok template to deploy all components to ECS Fargate. DNS and ACM
  should be configured manually.
Mappings:
  Images:
    Datagrok:
      domain: docker.io
      repo: datagrok/datagrok
    GrokConnect:
      domain: docker.io
      repo: datagrok/grok_connect
    GrokPipe:
      domain: docker.io
      repo: datagrok/grok_pipe
    GrokRegistryProxy:
      domain: docker.io
      repo: datagrok/grok_registry_proxy
    GrokSpawner:
      domain: docker.io
      repo: datagrok/grok_spawner
    JKG:
      domain: docker.io
      repo: datagrok/jupyter_kernel_gateway
    Rabbitmq:
      domain: docker.io
      repo: rabbitmq
    Searchdomain:
      domain: docker.io
      repo: docker/ecs-searchdomain-sidecar
      version: '1.0'
    Smtp:
      domain: docker.io
      repo: datagrok/smtp
      version: 1.0.0
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Network configuration
      Parameters:
      - DatagrokVPC
      - CIDR
      - DatagrokPublicSubnet1
      - DatagrokPublicSubnet2
      - DatagrokPrivateSubnet1
      - DatagrokPrivateSubnet2
      - DatagrokDataSubnet1
      - DatagrokDataSubnet2
      - DatagrokS3VPCEndpoint
      - DatagrokNatGatewayEIP
      - InternetIngressAccess
    - Label:
        default: Access configuration
      Parameters:
      - InternetSubnetAllow
      - InternetSubnetAllow2
      - InternetSubnetAllow3
    - Label:
        default: Docker Registry configuration
      Parameters:
      - EnableRegistryProxy
    - Label:
        default: Database configuration
      Parameters:
      - DBSnapshotIdentifier
    - Label:
        default: EKS configuration
      Parameters:
      - ExistingEksClusterName
      - KubernetesVersion
      - NodeInstanceType
      - NodeGroupMinSize
      - NodeGroupMaxSize
      - NodeGroupDesiredSize
      - NodeDiskSize
    - Label:
        default: GPU configuration
      Parameters:
      - GpuRequired
      - GpuInstanceType
    - Label:
        default: Helm chart
      Parameters:
      - HelmChartVersion
      - HelmNamespace
    - Label:
        default: Client Endpoint configuration
      Parameters:
      - DatagrokArnSSLCertificate
    - Label:
        default: Service version
      Parameters:
      - DatagrokVersion
      - GrokConnectVersion
      - GrokPipeVersion
      - RabbitmqVersion
      - GrokSpawnerVersion
      - GrokRegistryProxyVersion
      - JKGVersion
    - Label:
        default: Advanced
      Parameters:
      - Postfix
    ParameterLabels:
      CIDR:
        default: 'CIDR: VPC CIDR'
      DBSnapshotIdentifier:
        default: DB Snapshot Identifier (Optional)
      DatagrokArnSSLCertificate:
        default: 'DatagrokArnSSLCertificate: AWS ACM certificate ARN'
      DatagrokDataSubnet1:
        default: Data Subnet 1
      DatagrokDataSubnet2:
        default: Data Subnet 2
      DatagrokNatGatewayEIP:
        default: Nat Gateway EIP
      DatagrokPrivateSubnet1:
        default: Private Subnet 1
      DatagrokPrivateSubnet2:
        default: Private Subnet 2
      DatagrokPublicSubnet1:
        default: Public Subnet 1
      DatagrokPublicSubnet2:
        default: Public Subnet 2
      DatagrokS3VPCEndpoint:
        default: S3 VPC Endpoint
      DatagrokVPC:
        default: VPC
      DatagrokVersion:
        default: Datagrok Version
      EnableRegistryProxy:
        default: Enable Docker Registry Proxy (ECR-backed)
      ExistingEksClusterName:
        default: 'ExistingEksClusterName: Deploy to an existing EKS cluster (Optional)'
      GpuInstanceType:
        default: GPU Instance Type
      GpuRequired:
        default: GPU required
      GrokConnectVersion:
        default: Grok Connect Version
      GrokPipeVersion:
        default: Grok Pipe Version
      GrokRegistryProxyVersion:
        default: Grok Registry Proxy Version
      GrokSpawnerVersion:
        default: Grok Spawner Version
      HelmChartVersion:
        default: Helm chart version (Optional)
      HelmNamespace:
        default: Kubernetes namespace
      InternetIngressAccess:
        default: 'InternetIngressAccess: Access from internet'
      InternetSubnetAllow:
        default: 'InternetSubnetAllow: Allow connect from CIDR'
      InternetSubnetAllow2:
        default: 'InternetSubnetAllow2: Allow connect from additional CIDR (Optional)'
      InternetSubnetAllow3:
        default: 'InternetSubnetAllow3: Allow connect from additional CIDR (Optional)'
      JKGVersion:
        default: Jupyter Kernel Gateway Version
      KubernetesVersion:
        default: Kubernetes version
      NodeDiskSize:
        default: Node disk size (GiB)
      NodeGroupDesiredSize:
        default: Desired node count
      NodeGroupMaxSize:
        default: Maximum node count
      NodeGroupMinSize:
        default: Minimum node count
      NodeInstanceType:
        default: EC2 instance type for EKS nodes
      RabbitmqVersion:
        default: RabbitMQ Version
  cfn-lint:
    config:
      ignore_checks:
      - W8001
      - W8003
      - W8001
      - W8003
Outputs:
  DatagrokAdminPassword:
    Description: Admin password for first login
    Value:
      Fn::Sub:
      - https://${AWS::Region}.console.aws.amazon.com/secretsmanager/home?region=${AWS::Region}#!/secret?name=${secret}
      - secret:
          Ref: DatagrokAdminPassword
  DatagrokClusterName:
    Description: EKS cluster running Datagrok
    Value:
      Fn::GetAtt:
      - EKSClusterInfo
      - ClusterName
  DatagrokEndpoint:
    Description: Datagrok endpoint
    Value: Create DNS records for Datagrok using stated DNS Names as CNAMEs targets
  DatagrokInstallerLogs:
    Description: Helm installer logs (CodeBuild)
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${InstallerProject}/history?region=${AWS::Region}
  DatagrokKubeconfigCommand:
    Description: Command to configure kubectl for the cluster
    Value:
      Fn::Sub:
      - aws eks update-kubeconfig --region ${AWS::Region} --name ${cluster}
      - cluster:
          Fn::GetAtt:
          - EKSClusterInfo
          - ClusterName
  DatagrokLoadBalancerDNSName:
    Description: Datagrok Load Balancer DNS to create CNAME record
    Value:
      Fn::GetAtt:
      - DatagrokLoadBalancer
      - DNSName
Parameters:
  CIDR:
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+'
    Default: 10.0.0.0/17
    Description: VPC CIDR block to allow communication inside VPC
    Type: String
  DBSnapshotIdentifier:
    Default: ''
    Description: 'Optional: ARN or identifier of the RDS snapshot to restore from.
      Leave empty to create a new database.'
    Type: String
  DatagrokArnSSLCertificate:
    AllowedPattern: (arn:([^:\n]*):([^:\n]*):([^:\n]*):([^:\n]*):(([^:\/\n]*)[:\/])?(.*))?
    Description: The certificate is used for both Datagrok endpoint. If you do not
      use Route53 for DNS management, it is required to upload certificate to AWS
      ACM manually (https://docs.aws.amazon.com/acm/latest/userguide/import-certificate.html)
      and specify the Certificate ARN here.
    Type: String
  DatagrokDataSubnet1:
    Description: Data subnet to deploy Datagrok DB.
    Type: AWS::EC2::Subnet::Id
  DatagrokDataSubnet2:
    Description: Private subnet to deploy Datagrok DB.
    Type: AWS::EC2::Subnet::Id
  DatagrokNatGatewayEIP:
    Description: Private subnet Nat Gateway IP to allow access inside network to public
      load balancer. Omit if you disable access from internet (InternetIngressAccess).
    Type: String
  DatagrokPrivateSubnet1:
    Description: Private subnet to deploy Datagrok components.
    Type: AWS::EC2::Subnet::Id
  DatagrokPrivateSubnet2:
    Description: Private subnet to deploy Datagrok components.
    Type: AWS::EC2::Subnet::Id
  DatagrokPublicSubnet1:
    Description: Public subnet to deploy Datagrok Load Balancer. Use private subnet
      here if you disable access from internet (InternetIngressAccess).
    Type: AWS::EC2::Subnet::Id
  DatagrokPublicSubnet2:
    Description: Public subnet to deploy Datagrok Load Balancer. Use private subnet
      here if you disable access from internet (InternetIngressAccess).
    Type: AWS::EC2::Subnet::Id
  DatagrokS3VPCEndpoint:
    Default: ''
    Description: VPC Endpoint to access Datagrok S3 bucket. Omit if you do not use
      VPC endpoints
    Type: String
  DatagrokVPC:
    Description: VPC to deploy Datagrok stack
    Type: AWS::EC2::VPC::Id
  DatagrokVersion:
    AllowedPattern: ([0-9]+\.[0-9]+\.[0-9]+)|latest|stable|bleeding-edge
    Default: 1.27.12
    Description: Enter Datagrok docker image version.
    Type: String
  EnableRegistryProxy:
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
    Description: Deploy grok_registry_proxy as a Docker registry backed by ECR with
      Datagrok JWT authentication.
    Type: String
  ExistingEksClusterName:
    AllowedPattern: (^$)|(^[0-9A-Za-z][A-Za-z0-9\-_]*$)
    Default: ''
    Description: 'Leave empty to create a new EKS cluster. Set to the name of an existing
      cluster in the same VPC and region to install Datagrok there instead: the stack
      then skips the cluster and node groups, and installs the AWS Load Balancer Controller
      only when the cluster does not run one. The cluster must use the API or API_AND_CONFIG_MAP
      authentication mode, and its nodes must use the cluster security group.

      '
    Type: String
  GpuInstanceType:
    AllowedValues:
    - p3.2xlarge
    - p3.8xlarge
    - p3.16xlarge
    - p3dn.24xlarge
    - p5.48xlarge
    - g3s.xlarge
    - g3.4xlarge
    - g3.8xlarge
    - g3.16xlarge
    - g4dn.xlarge
    - g4dn.2xlarge
    - g4dn.4xlarge
    - g4dn.8xlarge
    - g4dn.12xlarge
    - g4dn.16xlarge
    - g5.xlarge
    - g5.2xlarge
    - g5.4xlarge
    - g5.8xlarge
    - g5.16xlarge
    - g5.12xlarge
    - g5.24xlarge
    - g5.48xlarge
    - g6.xlarge
    - g6.2xlarge
    - g6.4xlarge
    - g6.8xlarge
    - g6.16xlarge
    - g6.12xlarge
    - g6.24xlarge
    - g6.48xlarge
    - g6.metal
    - gr6.4xlarge
    - g6e.xlarge
    - g6e.2xlarge
    - g6e.4xlarge
    - g6e.8xlarge
    - g6e.16xlarge
    - g6e.12xlarge
    Default: g4dn.xlarge
    Description: The instance type for the GPU instance.
    Type: String
  GpuRequired:
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'false'
    Description: Set to true if you want to run GPU workloads.
    Type: String
  GrokConnectVersion:
    AllowedPattern: ([0-9]+\.[0-9]+\.[0-9]+)|latest|bleeding-edge
    Default: 2.8.4
    Description: Enter Grok Connect docker image version.
    Type: String
  GrokPipeVersion:
    AllowedPattern: ([0-9]+\.[0-9]+\.[0-9]+)|latest|bleeding-edge
    Default: 1.22.2
    Description: Enter Grok Pipe docker image version.
    Type: String
  GrokRegistryProxyVersion:
    AllowedPattern: ([0-9]+\.[0-9]+\.[0-9]+)|latest|bleeding-edge
    Default: 1.31.0
    Description: Enter Grok Registry Proxy docker image version.
    Type: String
  GrokSpawnerVersion:
    AllowedPattern: ([0-9]+\.[0-9]+\.[0-9]+)|latest|bleeding-edge
    Default: 2.24.0
    Description: Enter Grok Spawner docker image version.
    Type: String
  HelmChartVersion:
    Default: ''
    Description: 'Datagrok Helm chart version published at oci://registry-1.docker.io/datagrok/datagrok
      without the `-helm` suffix. Leave empty to use DatagrokVersion.

      '
    Type: String
  HelmNamespace:
    AllowedPattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    Default: datagrok
    Description: Kubernetes namespace for the Datagrok Helm release.
    Type: String
  InternetIngressAccess:
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
    Description: 'Do you want Datagrok to be available from internet? The exact subnet
      from which Datagrok will be available can be specified in ''InternetSubnetAllow:
      Allow connect to Datagrok from CIDR'' parameter.'
    Type: String
  InternetSubnetAllow:
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+'
    Description: Subnet for access to Datagrok endpoint. Set CIDR to 0.0.0.0/0 to
      allow all IP addresses access, or another CIDR range.
    Type: String
  InternetSubnetAllow2:
    AllowedPattern: (^$)|([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+)
    Default: ''
    Description: Additional subnet for access to Datagrok endpoint. You can omit this
      parameter is already specified InternetSubnetAllow.
    Type: String
  InternetSubnetAllow3:
    AllowedPattern: (^$)|([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+)
    Default: ''
    Description: Additional subnet for access to Datagrok endpoint. You can omit this
      parameter is already specified InternetSubnetAllow.
    Type: String
  JKGVersion:
    AllowedPattern: ([0-9]+\.[0-9]+\.[0-9]+)|latest|bleeding-edge
    Default: 1.34.1
    Description: Enter Datagrok Jupyter Kernel Gateway docker image version.
    Type: String
  KubernetesVersion:
    AllowedValues:
    - '1.34'
    - '1.35'
    - '1.36'
    Default: '1.35'
    Description: EKS control-plane Kubernetes version. Ignored when ExistingEksClusterName
      is set.
    Type: String
  NodeDiskSize:
    Default: 50
    Description: Root volume size in GiB for each EKS node.
    Type: Number
  NodeGroupDesiredSize:
    Default: 2
    MaxValue: 20
    MinValue: 1
    Type: Number
  NodeGroupMaxSize:
    Default: 4
    MaxValue: 20
    MinValue: 1
    Type: Number
  NodeGroupMinSize:
    Default: 2
    MaxValue: 20
    MinValue: 1
    Type: Number
  NodeInstanceType:
    Default: t3.xlarge
    Description: EC2 instance type for the EKS managed node group. Ignored when ExistingEksClusterName
      is set.
    Type: String
  Postfix:
    Description: URL postfix for backward compatibility. Leave blank for new installations
    Type: String
  RabbitmqVersion:
    Default: 4.0.5-management
    Description: Enter rabbitmq docker image version.
    Type: String
Resources:
  Datagrok443Ingress:
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow
      Description:
        Fn::Sub: ${AWS::StackName} 443/tcp on Datagrok ALB for Datagrok Server
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443Ingress2:
    Condition: AccessFromInternetSubnetAllow2
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow2
      Description:
        Fn::Sub: ${AWS::StackName} 443/tcp on Datagrok ALB for Datagrok Server
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443Ingress3:
    Condition: AccessFromInternetSubnetAllow3
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow3
      Description:
        Fn::Sub: ${AWS::StackName} 443/tcp on Datagrok ALB for Datagrok Server
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443IngressNatGW:
    Condition: AccessFromNatGW
    Properties:
      CidrIp:
        Fn::Sub:
        - ${ip}/32
        - ip:
            Ref: DatagrokNatGatewayEIP
      Description:
        Fn::Sub: ${AWS::StackName} NatGW 443/tcp on Datagrok ALB for Datagrok Server
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443IngressVPC:
    Properties:
      CidrIp:
        Ref: CIDR
      Description:
        Fn::Sub: ${AWS::StackName} VPC 443/tcp on Datagrok ALB for Datagrok Server
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80Ingress:
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow
      Description:
        Fn::Sub: ${AWS::StackName} 80/tcp on Datagrok ALB for Datagrok Server
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80Ingress2:
    Condition: AccessFromInternetSubnetAllow2
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow2
      Description:
        Fn::Sub: ${AWS::StackName} 80/tcp on Datagrok ALB for Datagrok Server
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80Ingress3:
    Condition: AccessFromInternetSubnetAllow3
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow3
      Description:
        Fn::Sub: ${AWS::StackName} 80/tcp on Datagrok ALB for Datagrok Server
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80IngressNatGW:
    Condition: AccessFromNatGW
    Properties:
      CidrIp:
        Fn::Sub:
        - ${ip}/32
        - ip:
            Ref: DatagrokNatGatewayEIP
      Description:
        Fn::Sub: ${AWS::StackName} NatGW 80/tcp on Datagrok ALB for Datagrok Server
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80IngressVPC:
    Properties:
      CidrIp:
        Ref: CIDR
      Description:
        Fn::Sub: ${AWS::StackName} VPC 80/tcp on Datagrok ALB for Datagrok Server
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  DatagrokALBEgressToCluster:
    Properties:
      Description:
        Fn::Sub: ${AWS::StackName} Datagrok pods egress rules
      DestinationSecurityGroupId:
        Fn::GetAtt:
        - EKSClusterInfo
        - ClusterSecurityGroupId
      FromPort: 0
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 65535
    Type: AWS::EC2::SecurityGroupEgress
  DatagrokALBSecurityGroup:
    Properties:
      GroupDescription:
        Fn::Sub: ${AWS::StackName} Datagrok ALB Security Group
      Tags:
      - Key: Name
        Value:
          Fn::Sub:
          - ${AWS::StackName}${postfix}-alb
          - postfix:
              Ref: Postfix
      - Key: datagrok.component
        Value: datagrok
      VpcId:
        Ref: DatagrokVPC
    Type: AWS::EC2::SecurityGroup
  DatagrokAdminDevKey:
    Properties:
      Description: Datagrok Admin user developer key
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: password
        PasswordLength: 24
        RequireEachIncludedType: true
        SecretStringTemplate: '{"user": "admin"}'
    Type: AWS::SecretsManager::Secret
  DatagrokAdminPassword:
    Properties:
      Description: Datagrok Admin user first-login password
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: password
        PasswordLength: 16
        RequireEachIncludedType: true
        SecretStringTemplate: '{"user": "admin"}'
    Type: AWS::SecretsManager::Secret
  DatagrokClusterIngressFromALB:
    Properties:
      Description:
        Fn::Sub: ${AWS::StackName} Allow communication from ALB to Datagrok pods
      FromPort: 0
      GroupId:
        Fn::GetAtt:
        - EKSClusterInfo
        - ClusterSecurityGroupId
      IpProtocol: TCP
      SourceSecurityGroupId:
        Ref: DatagrokALBSecurityGroup
      ToPort: 65535
    Type: AWS::EC2::SecurityGroupIngress
  DatagrokDB:
    DeletionPolicy: Snapshot
    Properties:
      AllocatedStorage: '50'
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 3
      DBInstanceClass: db.t3.large
      DBInstanceIdentifier:
        Fn::Sub:
        - ${AWS::StackName}${postfix}-rds
        - postfix:
            Ref: Postfix
      DBName:
        Fn::If:
        - RestoreFromSnapshot
        - Ref: AWS::NoValue
        - datagrok
      DBParameterGroupName:
        Ref: DatagrokDBParameterGroup
      DBSnapshotIdentifier:
        Fn::If:
        - RestoreFromSnapshot
        - Ref: DBSnapshotIdentifier
        - Ref: AWS::NoValue
      DBSubnetGroupName:
        Ref: DatagrokDBSubnetGroup
      DeleteAutomatedBackups: true
      DeletionProtection: false
      EnableIAMDatabaseAuthentication: true
      Engine: postgres
      EngineVersion: '17'
      MasterUserPassword:
        Fn::If:
        - RestoreFromSnapshot
        - Ref: AWS::NoValue
        - Fn::Sub:
          - '{{resolve:secretsmanager:${secret}:SecretString:password}}'
          - secret:
              Ref: DatagrokDbAdminUser
      MasterUsername:
        Fn::If:
        - RestoreFromSnapshot
        - Ref: AWS::NoValue
        - superuser
      MultiAZ: false
      Port: '5432'
      PubliclyAccessible: false
      StorageEncrypted: true
      Tags:
      - Key: datagrok.component
        Value: datagrok
      VPCSecurityGroups:
      - Ref: DatagrokDBSecurityGroup
    Type: AWS::RDS::DBInstance
    UpdateReplacePolicy: Delete
  DatagrokDBIngressFromCluster:
    Properties:
      Description:
        Fn::Sub: ${AWS::StackName} Allow connection from EKS pods
      FromPort: 5432
      GroupId:
        Ref: DatagrokDBSecurityGroup
      IpProtocol: TCP
      SourceSecurityGroupId:
        Fn::GetAtt:
        - EKSClusterInfo
        - ClusterSecurityGroupId
      ToPort: 5432
    Type: AWS::EC2::SecurityGroupIngress
  DatagrokDBParameterGroup:
    Properties:
      Description: Datagrok PostgreSQL tuning (SSD/EBS-aware planner, larger work_mem)
      Family: postgres17
      Parameters:
        effective_io_concurrency: '200'
        maintenance_work_mem: '524288'
        random_page_cost: '1.1'
        work_mem: '65536'
    Type: AWS::RDS::DBParameterGroup
  DatagrokDBSecurityGroup:
    Properties:
      GroupDescription:
        Fn::Sub: ${AWS::StackName} Datagrok DB Security Group
      SecurityGroupEgress: []
      SecurityGroupIngress:
      - Description:
