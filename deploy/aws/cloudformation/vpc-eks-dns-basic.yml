  EKSClusterInfo:
    DependsOn:
    - EKSClusterInfoLogGroup
    Properties:
      ClusterName:
        Fn::If:
        - CreateCluster
        - Ref: EKSCluster
        - Ref: ExistingEksClusterName
      ServiceToken:
        Fn::GetAtt:
        - EKSClusterInfoFunction
        - Arn
      VpcId:
        Ref: DatagrokVPC
    Type: AWS::CloudFormation::CustomResource
  EKSClusterInfoFunction:
    Properties:
      Code:
        ZipFile: "import boto3\nimport cfnresponse\n\n\ndef handler(event, context):\n\
          \    props = event['ResourceProperties']\n    physical = event.get('PhysicalResourceId',\
          \ 'none')\n    iam = boto3.client('iam')\n    try:\n        if event['RequestType']\
          \ == 'Delete':\n            # The physical id is the provider ARN only when\
          \ this resource created it.\n            if physical.startswith('arn:'):\n\
          \                try:\n                    iam.delete_open_id_connect_provider(OpenIDConnectProviderArn=physical)\n\
          \                except iam.exceptions.NoSuchEntityException:\n        \
          \            pass\n            cfnresponse.send(event, context, cfnresponse.SUCCESS,\
          \ {}, physical)\n            return\n        name = props['ClusterName']\n\
          \        cluster = boto3.client('eks').describe_cluster(name=name)['cluster']\n\
          \        vpc = cluster['resourcesVpcConfig']['vpcId']\n        if vpc !=\
          \ props['VpcId']:\n            raise Exception(f'EKS cluster {name} is in\
          \ {vpc}, the stack network is {props[\"VpcId\"]}')\n        mode = cluster.get('accessConfig',\
          \ {}).get('authenticationMode', 'CONFIG_MAP')\n        if mode == 'CONFIG_MAP':\n\
          \            raise Exception(f'EKS cluster {name} uses CONFIG_MAP authentication;\
          \ switch it to API_AND_CONFIG_MAP')\n        issuer = cluster['identity']['oidc']['issuer']\n\
          \        host = issuer.split('://', 1)[1]\n        arn_parts = context.invoked_function_arn.split(':')\n\
          \        arn = f'arn:{arn_parts[1]}:iam::{arn_parts[4]}:oidc-provider/{host}'\n\
          \        try:\n            iam.get_open_id_connect_provider(OpenIDConnectProviderArn=arn)\n\
          \            if physical != arn:\n                physical = 'existing:'\
          \ + host\n        except iam.exceptions.NoSuchEntityException:\n       \
          \     iam.create_open_id_connect_provider(Url=issuer, ClientIDList=['sts.amazonaws.com'])\n\
          \            physical = arn\n        data = {\n            'ClusterName':\
          \ name,\n            'ClusterSecurityGroupId': cluster['resourcesVpcConfig']['clusterSecurityGroupId'],\n\
          \            'OIDCProviderArn': arn,\n            'OIDCIssuerHost': host,\n\
          \        }\n        cfnresponse.send(event, context, cfnresponse.SUCCESS,\
          \ data, physical)\n    except Exception as e:\n        print(type(e).__name__,\
          \ e)\n        cfnresponse.send(event, context, cfnresponse.FAILED, {}, physical,\
          \ reason=str(e)[:500])\n"
      Description: Describes the Datagrok EKS cluster and ensures its IAM OIDC provider
        exists
