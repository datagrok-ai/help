---
# Resources shared by the ECS (fargate.template.yml) and EKS (eks.template.yml) profiles:
# client access (public ALB, its listeners and target groups), RDS, S3 and generated secrets.
# Both profiles merge this file, so the logical IDs and properties are identical by
# construction and replacing an ECS stack's template with the EKS one keeps the data.
AWSTemplateFormatVersion: '2010-09-09'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Access configuration"
        Parameters:
          - InternetSubnetAllow
          - InternetSubnetAllow2
          - InternetSubnetAllow3
      - Label:
          default: "Docker Registry configuration"
        Parameters:
          - EnableRegistryProxy
      - Label:
          default: "Database configuration"
        Parameters:
          - DBSnapshotIdentifier
    ParameterLabels:
      InternetSubnetAllow:
        default: "InternetSubnetAllow: Allow connect from CIDR"
      InternetSubnetAllow2:
        default: "InternetSubnetAllow2: Allow connect from additional CIDR (Optional)"
      InternetSubnetAllow3:
        default: "InternetSubnetAllow3: Allow connect from additional CIDR (Optional)"
      DBSnapshotIdentifier:
        default: "DB Snapshot Identifier (Optional)"
      EnableRegistryProxy:
        default: "Enable Docker Registry Proxy (ECR-backed)"
Parameters:
  InternetSubnetAllow:
    Type: String
    AllowedPattern: "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+"
    Description: Subnet for access to Datagrok endpoint. Set CIDR to 0.0.0.0/0 to allow all IP addresses access, or another CIDR range.
  InternetSubnetAllow2:
    Type: String
    AllowedPattern: "(^$)|([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+)"
    Default: ""
    Description: Additional subnet for access to Datagrok endpoint. You can omit this parameter is already specified InternetSubnetAllow.
  InternetSubnetAllow3:
    Type: String
    Default: ""
    AllowedPattern: "(^$)|([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+)"
    Description: Additional subnet for access to Datagrok endpoint. You can omit this parameter is already specified InternetSubnetAllow.
  GpuRequired:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: "Set to true if you want to run GPU workloads."
  GpuInstanceType:
    Type: String
    Default: 'g4dn.xlarge'
    Description: "The instance type for the GPU instance."
    AllowedValues: 
      - 'p3.2xlarge'
      - 'p3.8xlarge'
      - 'p3.16xlarge'
      - 'p3dn.24xlarge'
      - 'p5.48xlarge'
      - 'g3s.xlarge'
      - 'g3.4xlarge'
      - 'g3.8xlarge'
      - 'g3.16xlarge'
      - 'g4dn.xlarge'
      - 'g4dn.2xlarge'
      - 'g4dn.4xlarge'
      - 'g4dn.8xlarge'
      - 'g4dn.12xlarge'
      - 'g4dn.16xlarge'
      - 'g5.xlarge'
      - 'g5.2xlarge'
      - 'g5.4xlarge'
      - 'g5.8xlarge'
      - 'g5.16xlarge'
      - 'g5.12xlarge'
      - 'g5.24xlarge'
      - 'g5.48xlarge'
      - 'g6.xlarge'
      - 'g6.2xlarge'
      - 'g6.4xlarge'
      - 'g6.8xlarge'
      - 'g6.16xlarge'
      - 'g6.12xlarge'
      - 'g6.24xlarge'
      - 'g6.48xlarge'
      - 'g6.metal'
      - 'gr6.4xlarge'
      - 'g6e.xlarge'
      - 'g6e.2xlarge'
      - 'g6e.4xlarge'
      - 'g6e.8xlarge'
      - 'g6e.16xlarge'
      - 'g6e.12xlarge'
  DBSnapshotIdentifier:
    Description: 'Optional: ARN or identifier of the RDS snapshot to restore from. Leave empty to create a new database.'
    Type: String
    Default: ""
  EnableRegistryProxy:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: "Deploy grok_registry_proxy as a Docker registry backed by ECR with Datagrok JWT authentication."
Conditions:
  AccessFromNatGW:
    Fn::And:
      - Condition: InternetIngressAccess
      - Condition: InternetEgressAccess
  AccessFromInternetSubnetAllow2:
    Fn::Not:
      - Fn::Equals:
          - Ref: InternetSubnetAllow2
          - ''
  AccessFromInternetSubnetAllow3:
    Fn::Not:
      - Fn::Equals:
          - Ref: InternetSubnetAllow3
          - ''
  GpuRequired:
    Fn::Equals:
      - Ref: GpuRequired
      - 'true'
  RestoreFromSnapshot:
    Fn::Not:
      - Fn::Equals:
          - Ref: DBSnapshotIdentifier
          - ''
  RegistryProxyEnabled:
    Fn::Equals:
      - Ref: EnableRegistryProxy
      - 'true'
Rules:
  InternetSubnetAllow:
    RuleCondition:
      Fn::Or:
        - Fn::Not:
            - Fn::Equals:
                - Ref: InternetSubnetAllow2
                - ''
        - Fn::Not:
            - Fn::Equals:
                - Ref: InternetSubnetAllow3
                - ''
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: InternetSubnetAllow
                - Ref: InternetSubnetAllow2
        AssertDescription: Subnets for access to Datagrok client endpoints must be unique (InternetSubnetAllow and InternetSubnetAllow2 match)
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: InternetSubnetAllow
                - Ref: InternetSubnetAllow3
        AssertDescription: Subnets for access to Datagrok client endpoints must be unique (InternetSubnetAllow and InternetSubnetAllow3 match)
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - Ref: InternetSubnetAllow2
                - Ref: InternetSubnetAllow3
        AssertDescription: Subnets for access to Datagrok client endpoints must be unique (InternetSubnetAllow2 and InternetSubnetAllow3 match)
Resources:
  DatagrokDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription:
        Fn::Sub: "${AWS::StackName} Datagrok DatagrokDB Subnet Group"
      DBSubnetGroupName:
        Fn::Sub:
          - "${AWS::StackName}${postfix}-rds-subnet"
          - postfix:
              Ref: Postfix
      SubnetIds:
        - Ref: DatagrokDataSubnet1
        - Ref: DatagrokDataSubnet2
      Tags:
        - Key: datagrok.component
          Value: rds
  DatagrokSecurityGroup:
    Properties:
      GroupDescription:
        Fn::Sub: "${AWS::StackName} Datagrok Security Group"
      Tags:
        - Key: Name
          Value:
            Fn::Sub:
              - "${AWS::StackName}${postfix}"
              - postfix:
                  Ref: Postfix
        - Key: datagrok.component
          Value: datagrok
      VpcId:
        Ref: DatagrokVPC
    Type: AWS::EC2::SecurityGroup
  DatagrokALBSecurityGroup:
    Properties:
      GroupDescription:
        Fn::Sub: "${AWS::StackName} Datagrok ALB Security Group"
      Tags:
        - Key: Name
          Value:
            Fn::Sub:
              - "${AWS::StackName}${postfix}-alb"
              - postfix:
                  Ref: Postfix
        - Key: datagrok.component
          Value: datagrok
      VpcId:
        Ref: DatagrokVPC
    Type: AWS::EC2::SecurityGroup
  DatagrokSecurityGroupInternalCommunications:
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Allow communication within network Datagrok"
      GroupId:
        Ref: DatagrokSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId:
        Ref: DatagrokSecurityGroup
    Type: AWS::EC2::SecurityGroupIngress
  DatagrokSecurityGroupALBCommunications:
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Allow communication from ALB to Datagrok components"
      GroupId:
        Ref: DatagrokSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId:
        Ref: DatagrokALBSecurityGroup
    Type: AWS::EC2::SecurityGroupIngress
  DatagrokEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Datagrok egress rules"
      DestinationSecurityGroupId:
        Ref: DatagrokSecurityGroup
      FromPort: 0
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 65535
  Datagrok80Ingress:
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow
      Description:
        Fn::Sub: "${AWS::StackName} 80/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443Ingress:
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow
      Description:
        Fn::Sub: "${AWS::StackName} 443/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80Ingress2:
    Condition: AccessFromInternetSubnetAllow2
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow2
      Description:
        Fn::Sub: "${AWS::StackName} 80/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443Ingress2:
    Condition: AccessFromInternetSubnetAllow2
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow2
      Description:
        Fn::Sub: "${AWS::StackName} 443/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80Ingress3:
    Condition: AccessFromInternetSubnetAllow3
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow3
      Description:
        Fn::Sub: "${AWS::StackName} 80/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443Ingress3:
    Condition: AccessFromInternetSubnetAllow3
    Properties:
      CidrIp:
        Ref: InternetSubnetAllow3
      Description:
        Fn::Sub: "${AWS::StackName} 443/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80IngressVPC:
    Properties:
      CidrIp:
        Ref: CIDR
      Description:
        Fn::Sub: "${AWS::StackName} VPC 80/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443IngressVPC:
    Properties:
      CidrIp:
        Ref: CIDR
      Description:
        Fn::Sub: "${AWS::StackName} VPC 443/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok80IngressNatGW:
    Condition: AccessFromNatGW
    Properties:
      CidrIp:
        Fn::Sub:
          - "${ip}/32"
          - ip:
              Ref: DatagrokNatGatewayEIP
      Description:
        Fn::Sub: "${AWS::StackName} NatGW 80/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 80
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 80
    Type: AWS::EC2::SecurityGroupIngress
  Datagrok443IngressNatGW:
    Condition: AccessFromNatGW
    Properties:
      CidrIp:
        Fn::Sub:
          - "${ip}/32"
          - ip:
              Ref: DatagrokNatGatewayEIP
      Description:
        Fn::Sub: "${AWS::StackName} NatGW 443/tcp on Datagrok ALB for Datagrok Server"
      FromPort: 443
      GroupId:
        Ref: DatagrokALBSecurityGroup
      IpProtocol: TCP
      ToPort: 443
    Type: AWS::EC2::SecurityGroupIngress
  DatagrokTCP443Listener:
    Properties:
      DefaultActions:
        - ForwardConfig:
            TargetGroups:
              - TargetGroupArn:
                  Ref: DatagrokTCP8080TargetGroup
          Type: forward
      LoadBalancerArn:
        Ref: DatagrokLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn:
            Ref: DatagrokArnSSLCertificate
    Type: AWS::ElasticLoadBalancingV2::Listener
  DatagrokTCP8080TargetGroup:
    Properties:
      Name:
        Fn::Sub:
          - "${AWS::StackName}${postfix}"
          - postfix:
              Ref: Postfix
      Port: 8080
      Protocol: HTTP
      Tags:
        - Key: datagrok.component
          Value: datagrok
      TargetType: 'ip'
      VpcId:
        Ref: DatagrokVPC
      HealthCheckIntervalSeconds: 60
      HealthCheckPath: "/api/admin/health"
      Matcher:
        HttpCode: 200
      UnhealthyThresholdCount: 5
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
  DatagrokTCP80Listener:
    Properties:
      DefaultActions:
        - RedirectConfig:
            Port: '443'
            Protocol: HTTPS
            StatusCode: HTTP_301
          Type: redirect
      LoadBalancerArn:
        Ref: DatagrokLoadBalancer
      Port: 80
      Protocol: HTTP
    Type: AWS::ElasticLoadBalancingV2::Listener
  RabbitMQPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: "Automatically generated RabbitMQ password"
      GenerateSecretString:
        SecretStringTemplate: '{"password": "password"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludeCharacters: '"@/\!#$%^&*()-_=+[]{}|;:,.<>?`~'
  GrokPipeApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: "${AWS::StackName}-GrokPipeApiKey"
      Description: "Automatically generated API key for Datagrok"
      GenerateSecretString:
        SecretStringTemplate: '{"apikey": ""}'
        GenerateStringKey: apikey
        PasswordLength: 32
        ExcludeCharacters: '"@/\!#$%^&*()-_=+[]{}|;:,.<>?`~'
  DatagrokDbUser:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Datagrok Admin User First-login password
      GenerateSecretString:
        SecretStringTemplate: '{"user": "dg"}'
        GenerateStringKey: password
        RequireEachIncludedType: true
        PasswordLength: 32
        ExcludePunctuation: true
  DatagrokDbAdminUser:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Datagrok Admin User First-login password
      GenerateSecretString:
        SecretStringTemplate: '{"user": "superuser"}'
        GenerateStringKey: password
        RequireEachIncludedType: true
        PasswordLength: 32
        ExcludePunctuation: true
  DatagrokAdminPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Datagrok Admin user first-login password
      GenerateSecretString:
        SecretStringTemplate: '{"user": "admin"}'
        GenerateStringKey: password
        RequireEachIncludedType: true
        PasswordLength: 16
        ExcludePunctuation: true
  DatagrokAdminDevKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Datagrok Admin user developer key
      GenerateSecretString:
        SecretStringTemplate: '{"user": "admin"}'
        GenerateStringKey: password
        RequireEachIncludedType: true
        PasswordLength: 24
        ExcludePunctuation: true
  DatagrokDBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: "Datagrok PostgreSQL tuning (SSD/EBS-aware planner, larger work_mem)"
      Parameters:
        # Planner cost of random vs sequential reads. PG default 4.0 is for spinning
        # disks; 1.1 is appropriate for SSD/EBS and lets the planner pick index scans.
        random_page_cost: "1.1"
        # Bitmap-heap prefetch depth. PG default 1 underuses modern storage; 200 is
        # the recommended value for SSD/NVMe/EBS.
        effective_io_concurrency: "200"
        # Per-operation working memory for sorts/hashes (kB). Default 4MB.
        work_mem: "65536"
        # Memory for VACUUM, CREATE INDEX (kB). Default 64MB.
        maintenance_work_mem: "524288"
  DatagrokDB:
    Type: AWS::RDS::DBInstance
    UpdateReplacePolicy: Delete
    DeletionPolicy: Snapshot
    Properties:
      DBSnapshotIdentifier:
        Fn::If:
          - RestoreFromSnapshot
          - Ref: DBSnapshotIdentifier
          - Ref: "AWS::NoValue"
      DBParameterGroupName:
        Ref: DatagrokDBParameterGroup
      AllocatedStorage: '50'
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 3
      DBInstanceClass: db.t3.large
      DBInstanceIdentifier:
        Fn::Sub:
          - "${AWS::StackName}${postfix}-rds"
          - postfix:
              Ref: Postfix
      DBName:
        Fn::If:
          - RestoreFromSnapshot
          - Ref: "AWS::NoValue"
          - datagrok
      DBSubnetGroupName:
        Ref: DatagrokDBSubnetGroup
      DeleteAutomatedBackups: true
      DeletionProtection: false
      Engine: postgres
      EngineVersion: '17'
      MasterUsername:
        Fn::If:
          - RestoreFromSnapshot
          - Ref: "AWS::NoValue"
          - superuser
      MasterUserPassword:
        Fn::If:
          - RestoreFromSnapshot
          - Ref: "AWS::NoValue"
          - Fn::Sub:
              - "{{resolve:secretsmanager:${secret}:SecretString:password}}"
              - secret:
                  Ref: DatagrokDbAdminUser
      MultiAZ: false
      Port: '5432'
      PubliclyAccessible: false
      StorageEncrypted: true
      Tags:
        - Key: datagrok.component
          Value: datagrok
      VPCSecurityGroups:
        - Ref: DatagrokDBSecurityGroup
      EnableIAMDatabaseAuthentication: true
  DatagrokS3:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName:
        Fn::Sub:
          - "${AWS::StackName}${postfix}-s3-${uuid}"
          - postfix:
              Ref: Postfix
            uuid:
              Fn::Select:
                - 2
                - Fn::Split:
                    - "/"
                    - Ref: AWS::StackId
      ObjectLockEnabled: false
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: datagrok.component
          Value: datagrok
  DatagrokS3Policy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DatagrokS3
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Fn::If:
              - UseVPCEndpoint
              - Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Condition:
                  StringNotEquals:
                    aws:SourceVpce:
                      Ref: DatagrokS3VPCEndpoint
                    "aws:PrincipalArn":
                      - Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
                      - Ref: DatagrokS3EmptyLambdaRole
                Effect: Deny
                Principal: '*'
                Resource:
                  - Fn::GetAtt:
                      - DatagrokS3
                      - Arn
                  - Fn::Sub:
                      - ${bucket}/*
                      - bucket:
                          Fn::GetAtt:
                            - DatagrokS3
                            - Arn
              - Ref: "AWS::NoValue"
          - Principal: "*"
            Action: "*"
            Effect: Deny
            Resource:
              - Fn::GetAtt:
                  - DatagrokS3
                  - Arn
              - Fn::Sub:
                  - "${bucket}/*"
                  - bucket:
                      Fn::GetAtt:
                        - DatagrokS3
                        - Arn
            Condition:
              Bool:
                aws:SecureTransport: false
  DatagrokS3EmptyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName:
            Fn::Sub: "${AWS::StackName}-s3-lambda"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}S3EmptyLambdaFunction-*:*"
              - Action:
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Effect: Allow
                Resource:
                  - Fn::GetAtt:
                      - DatagrokS3
                      - Arn
                  - Fn::Sub:
                      - "${bucket}/*"
                      - bucket:
                          Fn::GetAtt:
                            - DatagrokS3
                            - Arn
  DatagrokS3EmptyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Empty S3 bucket on CFN deletion for Datagrok
      Code:
        ZipFile: |
          import boto3
          import cfnresponse


          def handler(event, context):
              try:
                  bucket = event['ResourceProperties']['BucketName']
                  status = 0

                  if event['RequestType'] == 'Delete':
                      s3 = boto3.resource('s3')
                      bucket = s3.Bucket(bucket)
                      for obj in bucket.objects.filter():
                          s3.Object(bucket.name, obj.key).delete()
                      status = 201

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Status': status})
              except Exception as e:
                  print(type(e).__name__, e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Exception': f"{type(e).__name__} {e}"})
      Handler: index.handler
      Runtime: python3.13
      Role:
        Fn::GetAtt:
          - DatagrokS3EmptyLambdaRole
          - Arn
      MemorySize: 128
      Timeout: 600
  DatagrokS3EmptyLambdaFunctionDatagrokLogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      LogGroupName:
        Fn::Sub:
          - "/aws/lambda/${function_name}"
          - function_name:
              Ref: DatagrokS3EmptyLambdaFunction
      RetentionInDays: 1
  DatagrokS3Empty:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - DatagrokS3EmptyLambdaFunctionDatagrokLogGroup
    Properties:
      BucketName:
        Ref: DatagrokS3
      ServiceToken:
        Fn::GetAtt:
          - DatagrokS3EmptyLambdaFunction
          - Arn
  DatagrokLoadBalancer:
    Properties:
      Name:
        Fn::Sub:
          - "${AWS::StackName}${postfix}"
          - postfix:
              Ref: Postfix
      Scheme:
        'Fn::If':
          - InternetIngressAccess
          - 'internet-facing'
          - 'internal'
      SecurityGroups:
        - Ref: DatagrokALBSecurityGroup
      Subnets:
        'Fn::If':
          - InternetIngressAccess
          - - Ref: DatagrokPublicSubnet1
            - Ref: DatagrokPublicSubnet2
          - - Ref: DatagrokPrivateSubnet1
            - Ref: DatagrokPrivateSubnet2
      Tags:
        - Key: Name
          Value:
            Fn::Sub:
              - "${AWS::StackName}${postfix}-alb"
              - postfix:
                  Ref: Postfix
        - Key: datagrok.component
          Value: datagrok
      Type: application
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
  DatagrokTCP5000ExtTargetGroup:
    Condition: RegistryProxyEnabled
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Sub: "${AWS::StackName}-rp-e"
      Port: 5000
      Protocol: HTTP
      Tags:
        - Key: datagrok.component
          Value: datagrok
      TargetType: 'ip'
      VpcId:
        Ref: DatagrokVPC
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: "/health"
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      UnhealthyThresholdCount: 3
  RegistryProxyListenerRule:
    Condition: RegistryProxyEnabled
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn:
            Ref: DatagrokTCP5000ExtTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - "registry.*"
      ListenerArn:
        Ref: DatagrokTCP443Listener
      Priority: 10
  DatagrokPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Datagrok policy to access AWS resources"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
            Condition: { }
            Effect: Allow
            Resource:
              - Fn::GetAtt:
                  - DatagrokS3
                  - Arn
              - Fn::Sub:
                  - "${bucket}/*"
                  - bucket:
                      Fn::GetAtt:
                        - DatagrokS3
                        - Arn
      ManagedPolicyName:
        Fn::Sub: "${AWS::StackName}S3Access-${AWS::Region}"
  GrokRegistryProxyECRPolicy:
    Condition: RegistryProxyEnabled
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Registry Proxy ECR policy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - ecr:GetAuthorizationToken
            Effect: Allow
            Resource: "*"
          - Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:CompleteLayerUpload
              - ecr:UploadLayerPart
              - ecr:InitiateLayerUpload
              - ecr:PutImage
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:CreateRepository
              - ecr:TagResource
            Effect: Allow
            Resource:
              Fn::Sub: "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/datagrok/*"
      ManagedPolicyName:
        Fn::Sub: "${AWS::StackName}-RegistryProxy-ECR-${AWS::Region}"
Outputs:
  DatagrokAdminPassword:
    Description: Admin password for first login
    Value:
      Fn::Sub:
        - "https://${AWS::Region}.console.aws.amazon.com/secretsmanager/home?region=${AWS::Region}#!/secret?name=${secret}"
        - secret:
            Ref: DatagrokAdminPassword
