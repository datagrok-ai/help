                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${cluster_name}"
                  - cluster_name:
                      Ref: DatagrokCluster
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${cluster_name}"
                  - cluster_name:
                      Ref: CvmCluster
          - Action:
              - "ecs:DescribeContainerInstances"
            Effect: Allow
            Resource:
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${cluster_name}/*"
                  - cluster_name:
                      Ref: DatagrokCluster
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:container-instance/${cluster_name}/*"
                  - cluster_name:
                      Ref: CvmCluster
          - Action:
              - "ecs:CreateService"
              - "ecs:TagResource"
            Condition:
              StringEquals:
                aws:RequestTag/caller: [ "grok_spawner" ]
              ArnEquals:
                ecs:cluster:
                  - Fn::GetAtt:
                      - DatagrokCluster
                      - Arn
                  - Fn::GetAtt:
                      - CvmCluster
                      - Arn
            Effect: Allow
