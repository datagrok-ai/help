                  - cluster_name:
                      Ref: DatagrokCluster
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${cluster_name}/*"
                  - cluster_name:
                      Ref: CvmCluster
          - Action:
