              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${cluster_name}/*"
                  - cluster_name:
                      Ref: CvmCluster
          - Action:
              - "ecs:DescribeTasks"
            Condition:
              ArnEquals:
                ecs:cluster:
                  - Fn::GetAtt:
                      - DatagrokCluster
                      - Arn
                  - Fn::GetAtt:
                      - CvmCluster
                      - Arn
            Effect: Allow
            Resource:
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${cluster_name}/*"
                  - cluster_name:
                      Ref: DatagrokCluster
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${cluster_name}/*"
                  - cluster_name:
                      Ref: CvmCluster
          - Action:
