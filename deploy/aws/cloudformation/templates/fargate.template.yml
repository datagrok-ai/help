    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Grok Spawner ECR policy to access AWS resources"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - ecr:GetAuthorizationToken
            Effect: Allow
            Resource: "*"
          - Action:
              - ecr:CreateRepository
            Condition:
              StringEquals:
                aws:RequestTag/builder: [ "grok_spawner" ]
            Effect: Allow
            Resource: "*"
          - Action:
              - ecr:TagResource
            Condition:
              StringEquals:
                aws:RequestTag/builder: [ "grok_spawner" ]
            Effect: Allow
            Resource:
              Fn::Sub: "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/datagrok/*"
          - Action:
              - "ecr:DescribeRepositories"
              - "ecr:ListImages"
            Effect: Allow
            Resource:
              Fn::Sub: "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/datagrok/*"
      ManagedPolicyName:
        Fn::Sub: "${AWS::StackName}-GrokSpawner-ECR-${AWS::Region}"
  DatagrokSpawnerTagsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Policy for tagging resources"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - ecs:TagResource
            Effect: Allow
            Condition:
              StringEquals:
                "ecs:CreateAction":
                  - "CreateService"
                  - "RegisterTaskDefinition"
                  - "UpdateService"
            Resource:
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${cluster_name}/*"
                  - cluster_name:
                      Ref: DatagrokCluster
              - Fn::Sub:
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${cluster_name}/*"
                  - cluster_name:
                      Ref: CvmCluster
              - Fn::Sub: "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/*"

  GrokSpawnerTaskRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Condition: { }
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - Ref: GrokSpawnerPolicy
        - Ref: GrokSpawnerECRPolicy
        - Ref: DatagrokECSPolicy
        - Ref: DatagrokSpawnerTagsPolicy
      Tags:
        - Key: datagrok.component
          Value: datagrok
        - Key: datagrok.service
          Value: grok_spawner
    Type: AWS::IAM::Role
  GrokSpawnerService:
    DependsOn:
      - DatagrokTCP8000IntListener
    Properties:
      Cluster:
        Fn::GetAtt:
          - DatagrokCluster
          - Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DeploymentController:
        Type: ECS
      DesiredCount: 1
      LaunchType: "FARGATE"
      LoadBalancers:
        - ContainerName: grok_spawner
          ContainerPort: 8000
          TargetGroupArn:
            Ref: DatagrokTCP8000IntTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Ref: DatagrokSecurityGroup
          Subnets:
            - Ref: DatagrokPrivateSubnet1
            - Ref: DatagrokPrivateSubnet2
      PlatformVersion: 1.4.0
      PropagateTags: SERVICE
      SchedulingStrategy: REPLICA
      ServiceRegistries:
        - RegistryArn:
            Fn::GetAtt:
              - GrokSpawnerServiceDiscoveryEntry
              - Arn
      Tags:
        - Key: datagrok.component
          Value: datagrok
        - Key: datagrok.service
          Value: grok_spawner
      TaskDefinition:
        Ref: GrokSpawnerTaskDefinition
    Type: AWS::ECS::Service
  GrokSpawnerServiceDiscoveryEntry:
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Datagrok grok_spawner service discovery entry in Cloud Map"
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: grok_spawner
      NamespaceId:
        Ref: DatagrokCloudMap
    Type: AWS::ServiceDiscovery::Service
  GrokSpawnerTaskDefinition:
    Properties:
      ContainerDefinitions:
        - Command:
            - Fn::Sub: "${AWS::Region}.compute.internal"
            - Fn::Sub: ${AWS::StackName}.datagrok.${AWS::Region}.lb.internal
            - Fn::Sub: ${AWS::StackName}.datagrok.${AWS::Region}.cm.internal
          Essential: false
          Image:
            Fn::Sub:
              - "${domain}/${repo}:${tag}"
              - domain:
                  Fn::FindInMap: [ Images, Searchdomain, domain ]
                repo:
                  Fn::FindInMap: [ Images, Searchdomain, repo ]
                tag:
                  Fn::FindInMap: [ Images, Searchdomain, version ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: DatagrokLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: grok_spawner
          MemoryReservation: 100
          ReadonlyRootFilesystem: true
          Name: ResolvConf
        - DependsOn:
            - Condition: SUCCESS
              ContainerName: ResolvConf
          Essential: true
          Image:
            Fn::Sub:
              - "${domain}/${repo}:${tag}"
              - domain:
                  Fn::FindInMap: [ Images, GrokSpawner, domain ]
                repo:
                  Fn::FindInMap: [ Images, GrokSpawner, repo ]
                tag:
                  Ref: GrokSpawnerVersion
          Environment:
            - Name: "GROK_SPAWNER_ENVIRONMENT"
              Value:
                Fn::Sub: "${AWS::StackName}"
            - Name: "GROK_SPAWNER_DATAGROK_ECS__CLUSTER"
              Value:
                Ref: DatagrokCluster
            - Name: "GROK_SPAWNER_DATAGROK_ECS__CLUSTER_REGION"
              Value:
                Fn::Sub: "${AWS::Region}"
            - Name: "GROK_SPAWNER_DATAGROK_ECS__LAUNCH_TYPE"
              Value: "EC2"
            - Name: "GROK_SPAWNER_DATAGROK_ECS__SUBNETS"
              Value:
                Fn::Sub:
                  - '["${s1}", "${s2}"]'
                  - s1:
                      Ref: DatagrokPrivateSubnet1
                    s2:
                      Ref: DatagrokPrivateSubnet2
            - Name: "GROK_SPAWNER_DATAGROK_ECS__SECURITY_GROUPS"
              Value:
                Fn::Sub:
                  - '["${s1}"]'
                  - s1:
                      Ref: DatagrokSecurityGroup
            - Name: "GROK_SPAWNER_REGISTRY__URL"
              Value:
                Fn::Sub: "grok_registry_proxy.${AWS::StackName}.datagrok.${AWS::Region}.lb.internal:5000"
            - Name: "GROK_SPAWNER_DATAGROK_ECS__LOG_GROUP"
              Value:
                Fn::Sub:
                  - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${logs}
                  - logs:
                      Ref: DatagrokLogGroup
            - Name: "GROK_SPAWNER_CVM_ECS__CLUSTER"
              Value:
                Ref: CvmCluster
            - Name: "GROK_SPAWNER_CVM_ECS__CLUSTER_REGION"
              Value:
                Fn::Sub: "${AWS::Region}"
            - Name: "GROK_SPAWNER_CVM_ECS__LAUNCH_TYPE"
              Value: "EC2"
            - Name: "GROK_SPAWNER_CVM_ECS__SUBNETS"
              Value:
                Fn::Sub:
                  - '["${s1}", "${s2}"]'
                  - s1:
                      Ref: DatagrokPrivateSubnet1
                    s2:
                      Ref: DatagrokPrivateSubnet2
            - Name: "GROK_SPAWNER_CVM_ECS__SECURITY_GROUPS"
              Value:
                Fn::Sub:
                  - '["${s1}"]'
                  - s1:
                      Ref: CvmSecurityGroup
            - Name: "GROK_SPAWNER_CVM_ECS__LOG_GROUP"
              Value:
                Fn::Sub:
                  - arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${logs}
                  - logs:
                      Ref: DatagrokLogGroup
            - Name: "GROK_SPAWNER_DATAGROK_ECS__EXEC_ROLE"
              Value:
                Ref: DatagrokTaskExecutionRole
            - Name: "GROK_SPAWNER_CVM_ECS__EXEC_ROLE"
              Value:
                Ref: DatagrokTaskExecutionRole
          LinuxParameters: { }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: DatagrokLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: grok_spawner
          MemoryReservation: 100
          #          ReadonlyRootFilesystem: true
          Name: grok_spawner
          PortMappings:
            - ContainerPort: 8000
              HostPort: 8000
              Protocol: tcp
      Cpu: '1024'
      ExecutionRoleArn:
        Fn::GetAtt:
          - DatagrokTaskExecutionRole
          - Arn
      Family:
        Fn::Sub:
          - "${AWS::StackName}${postfix}-grok_spawner"
          - postfix:
              Ref: Postfix
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - "FARGATE"
      TaskRoleArn:
        Fn::GetAtt:
          - GrokSpawnerTaskRole
          - Arn
    Type: AWS::ECS::TaskDefinition
  GrokSpawnerPrivateDNS:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: DatagrokPrivateDNSZone
      Comment:
        Fn::Sub: "${AWS::StackName} Private Datagrok grok spawner DNS for internal routing"
      Name:
        Fn::Sub: "grok_spawner.${AWS::StackName}.datagrok.${AWS::Region}.lb.internal."
      Type: A
      AliasTarget:
        HostedZoneId:
          Fn::GetAtt:
            - DatagrokLoadBalancerInt
            - CanonicalHostedZoneID
        DNSName:
          Fn::GetAtt:
            - DatagrokLoadBalancerInt
            - DNSName
  DatagrokTCP8000IntListener:
    Properties:
      DefaultActions:
        - ForwardConfig:
            TargetGroups:
              - TargetGroupArn:
                  Ref: DatagrokTCP8000IntTargetGroup
          Type: forward
      LoadBalancerArn:
        Ref: DatagrokLoadBalancerInt
      Port: 8000
      Protocol: HTTP
    Type: AWS::ElasticLoadBalancingV2::Listener
  DatagrokTCP8000IntTargetGroup:
    Properties:
      Name:
        Fn::Sub: "${AWS::StackName}-gs-i"
      Port: 8000
      Protocol: HTTP
      Tags:
        - Key: datagrok.component
          Value: datagrok
      TargetType: 'ip'
      VpcId:
        Ref: DatagrokVPC
      HealthCheckIntervalSeconds: 60
      HealthCheckPath: "/info"
      Matcher:
        HttpCode: 200
      UnhealthyThresholdCount: 5
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
  # --- Registry Proxy Resources (conditional on EnableRegistryProxy) ---
  GrokRegistryProxyTaskRole:
    Condition: RegistryProxyEnabled
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - sts:AssumeRole
            Condition: { }
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
      ManagedPolicyArns:
        - Ref: GrokRegistryProxyECRPolicy
        - Ref: DatagrokECSPolicy
      Tags:
        - Key: datagrok.component
          Value: datagrok
        - Key: datagrok.service
          Value: grok_registry_proxy
  GrokRegistryProxyTaskDefinition:
    Condition: RegistryProxyEnabled
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Command:
            - Fn::Sub: "${AWS::Region}.compute.internal"
            - Fn::Sub: ${AWS::StackName}.datagrok.${AWS::Region}.lb.internal
            - Fn::Sub: ${AWS::StackName}.datagrok.${AWS::Region}.cm.internal
          Essential: false
          Image:
            Fn::Sub:
              - "${domain}/${repo}:${tag}"
              - domain:
                  Fn::FindInMap: [ Images, Searchdomain, domain ]
                repo:
                  Fn::FindInMap: [ Images, Searchdomain, repo ]
                tag:
                  Fn::FindInMap: [ Images, Searchdomain, version ]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: DatagrokLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: grok_registry_proxy
          MemoryReservation: 100
          ReadonlyRootFilesystem: true
          Name: ResolvConf
        - DependsOn:
            - Condition: SUCCESS
              ContainerName: ResolvConf
          Essential: true
          Image:
            Fn::Sub:
              - "${domain}/${repo}:${tag}"
              - domain:
                  Fn::FindInMap: [ Images, GrokRegistryProxy, domain ]
                repo:
                  Fn::FindInMap: [ Images, GrokRegistryProxy, repo ]
                tag:
                  Ref: GrokRegistryProxyVersion
          Environment:
            - Name: "DATAGROK_URL"
              Value:
                Fn::Sub: "http://datagrok.${AWS::StackName}.datagrok.${AWS::Region}.lb.internal:8080/api"
            - Name: "REGISTRY_URL"
              Value:
                Fn::Sub: "https://${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
            - Name: "ECR_MODE"
              Value: "true"
            - Name: "AWS_REGION"
              Value:
                Ref: AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: DatagrokLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: grok_registry_proxy
          MemoryReservation: 256
          Name: grok_registry_proxy
          PortMappings:
            - ContainerPort: 5000
              HostPort: 5000
              Protocol: tcp
      Cpu: '512'
      ExecutionRoleArn:
        Fn::GetAtt:
          - DatagrokTaskExecutionRole
          - Arn
      Family:
        Fn::Sub:
          - "${AWS::StackName}${postfix}-grok_registry_proxy"
          - postfix:
              Ref: Postfix
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - "FARGATE"
      TaskRoleArn:
        Fn::GetAtt:
          - GrokRegistryProxyTaskRole
          - Arn
  GrokRegistryProxyService:
    Condition: RegistryProxyEnabled
    Type: AWS::ECS::Service
    DependsOn:
      - DatagrokTCP5000IntListener
      - RegistryProxyListenerRule
    Properties:
      Cluster:
        Fn::GetAtt:
          - DatagrokCluster
          - Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DeploymentController:
        Type: ECS
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 120
      LaunchType: "FARGATE"
      LoadBalancers:
        - ContainerName: grok_registry_proxy
          ContainerPort: 5000
          TargetGroupArn:
            Ref: DatagrokTCP5000IntTargetGroup
        - ContainerName: grok_registry_proxy
          ContainerPort: 5000
          TargetGroupArn:
            Ref: DatagrokTCP5000ExtTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Ref: DatagrokSecurityGroup
          Subnets:
            - Ref: DatagrokPrivateSubnet1
            - Ref: DatagrokPrivateSubnet2
      PlatformVersion: 1.4.0
      PropagateTags: SERVICE
      SchedulingStrategy: REPLICA
      ServiceRegistries:
        - RegistryArn:
            Fn::GetAtt:
              - GrokRegistryProxyServiceDiscoveryEntry
              - Arn
      Tags:
        - Key: datagrok.component
          Value: datagrok
        - Key: datagrok.service
          Value: grok_registry_proxy
      TaskDefinition:
        Ref: GrokRegistryProxyTaskDefinition
  GrokRegistryProxyServiceDiscoveryEntry:
    Condition: RegistryProxyEnabled
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} Datagrok grok_registry_proxy service discovery entry in Cloud Map"
      DnsConfig:
        DnsRecords:
          - TTL: 60
            Type: A
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: grok_registry_proxy
      NamespaceId:
        Ref: DatagrokCloudMap
  DatagrokTCP5000IntListener:
    Condition: RegistryProxyEnabled
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - ForwardConfig:
            TargetGroups:
              - TargetGroupArn:
                  Ref: DatagrokTCP5000IntTargetGroup
          Type: forward
      LoadBalancerArn:
        Ref: DatagrokLoadBalancerInt
      Port: 5000
      Protocol: HTTP
  DatagrokTCP5000IntTargetGroup:
    Condition: RegistryProxyEnabled
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Sub: "${AWS::StackName}-rp-i"
      Port: 5000
      Protocol: HTTP
      Tags:
        - Key: datagrok.component
          Value: datagrok
      TargetType: 'ip'
      VpcId:
        Ref: DatagrokVPC
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: "/health"
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      UnhealthyThresholdCount: 3
  GrokRegistryProxyPrivateDNS:
    Condition: RegistryProxyEnabled
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: DatagrokPrivateDNSZone
      Comment:
        Fn::Sub: "${AWS::StackName} Private Datagrok registry proxy DNS for internal routing"
      Name:
        Fn::Sub: "grok_registry_proxy.${AWS::StackName}.datagrok.${AWS::Region}.lb.internal."
      Type: A
      AliasTarget:
        HostedZoneId:
          Fn::GetAtt:
            - DatagrokLoadBalancerInt
            - CanonicalHostedZoneID
        DNSName:
          Fn::GetAtt:
            - DatagrokLoadBalancerInt
            - DNSName
  GpuInstanceRole:
    Condition: GpuRequired
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Condition: { }
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role"
  GpuInstanceProfile:
    Condition: GpuRequired
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        -  Ref: GpuInstanceRole
  GpuInstance:
    Condition: GpuRequired
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile:
        Ref: GpuInstanceProfile
      ImageId: 
        Ref: GpuAMI
      InstanceType:
        Ref: GpuInstanceType
      SecurityGroupIds:
        - Ref: CvmSecurityGroup
      SubnetId:
        Ref: DatagrokPrivateSubnet1
      Tags:
        - Key: Name
          Value: 
            Fn::Sub: "${AWS::StackName}-gpu-instance"
      UserData:
        Fn::Base64:
          Fn::Sub: 
            - |
              #!/bin/bash -xe
              echo "ECS_CLUSTER=${CvmCluster}" >> /etc/ecs/ecs.config
              echo "ECS_ENABLE_GPU_SUPPORT=true" >> /etc/ecs/ecs.config
              echo "ECS_IMAGE_PULL_BEHAVIOR=once" >> /etc/ecs/ecs.config
            - CvmCluster:
                Ref: CvmCluster
