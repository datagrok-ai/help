# DEV follows bleeding-edge. A scheduled job resolves the tag to its current
# digest and commits it here, so every refresh is a recorded, revertible rollout.
env: dev
hostname: dev.datagrok.example.com
datagrok:
  chartVersion: bleeding-edge-helm
  imageTag: bleeding-edge
  imageDigest: ""     # sha256:... written by the refresh job
db:
  host: ""            # after the first sync: kubectl get dge datagrok-dev
