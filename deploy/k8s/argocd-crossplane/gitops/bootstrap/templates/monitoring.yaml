{{- $m := .Values.monitoring }}
{{- /* An unquoted off in YAML is the boolean false. */}}
{{- $mode := toString $m.mode | replace "false" "off" }}
{{- if ne $mode "off" }}
{{- if not (has $mode (list "local" "external")) }}
{{- fail (printf "monitoring.mode: %s. Use off, local or external" $mode) }}
{{- end }}
{{- if and (eq $mode "external") (not $m.external.url) (not $m.remoteWrite) }}
{{- fail "monitoring.mode external needs monitoring.external.url" }}
{{- end }}
{{- if not .Values.aws.cloudwatchExporterRoleArn }}
{{- fail "monitoring needs the IAM role Terraform creates when monitoring_mode is not off" }}
{{- end }}
{{- $retry := dict "limit" -1 "backoff" (dict "duration" "30s" "factor" 2 "maxDuration" "5m") }}
{{- $local := eq $mode "local" }}
{{- $remoteWrite := list }}
{{- with $m.external.url }}
{{- $target := dict "url" . }}
{{- if $m.external.basicAuth }}
{{- $_ := set $target "basicAuth" (dict
      "username" (dict "name" "prometheus-remote-write" "key" "username")
      "password" (dict "name" "prometheus-remote-write" "key" "password")) }}
{{- end }}
{{- $remoteWrite = list $target }}
{{- end }}
{{- $stack := dict
  "crds" (dict "enabled" true)
  "kubeControllerManager" (dict "enabled" false)
  "kubeScheduler" (dict "enabled" false)
  "kubeEtcd" (dict "enabled" false)
  "kubeProxy" (dict "enabled" false)
  "defaultRules" (dict "create" $local)
  "alertmanager" (dict "enabled" $local)
  "grafana" (dict "enabled" $local "testFramework" (dict "enabled" false))
  "prometheus" (dict
    "agentMode" (not $local)
    "prometheusSpec" (dict
      "scrapeInterval" "30s"
      "externalLabels" (dict "cluster" (printf "datagrok-%s" .Values.env))
      "ruleSelectorNilUsesHelmValues" false
      "serviceMonitorSelectorNilUsesHelmValues" false
      "podMonitorSelectorNilUsesHelmValues" false
      "probeSelectorNilUsesHelmValues" false
      "scrapeConfigSelectorNilUsesHelmValues" false
      "remoteWrite" (concat $remoteWrite $m.remoteWrite))) }}
{{- if $local }}
{{- $_ := set $stack.prometheus.prometheusSpec "retention" $m.retention }}
{{- $_ := set $stack.prometheus.prometheusSpec "storageSpec" (dict "volumeClaimTemplate" (dict "spec" (dict
      "storageClassName" "datagrok-gp3"
      "accessModes" (list "ReadWriteOnce")
      "resources" (dict "requests" (dict "storage" $m.storageSize))))) }}
{{- $_ := set $stack.alertmanager "alertmanagerSpec" (dict "storage" (dict "volumeClaimTemplate" (dict "spec" (dict
      "storageClassName" "datagrok-gp3"
      "accessModes" (list "ReadWriteOnce")
      "resources" (dict "requests" (dict "storage" "2Gi")))))) }}
{{- /* The password is generated by the datagrok-monitoring chart (grafana-admin). */}}
{{- $_ := set $stack.grafana "admin" (dict "existingSecret" "grafana-admin" "userKey" "admin-user" "passwordKey" "admin-password") }}
{{- with $m.grafana.hostname }}
{{- $annotations := dict
      "alb.ingress.kubernetes.io/scheme" "internet-facing"
      "alb.ingress.kubernetes.io/target-type" "ip"
      "alb.ingress.kubernetes.io/listen-ports" "[{\"HTTP\":80},{\"HTTPS\":443}]"
      "alb.ingress.kubernetes.io/ssl-redirect" "443"
      "alb.ingress.kubernetes.io/ssl-policy" "ELBSecurityPolicy-TLS13-1-2-2021-06" }}
{{- with $m.grafana.certificateArn }}
{{- $_ := set $annotations "alb.ingress.kubernetes.io/certificate-arn" . }}
{{- end }}
{{- $_ := set $stack.grafana "ingress" (dict "enabled" true "ingressClassName" "alb" "hosts" (list .) "annotations" $annotations) }}
{{- $_ := set $stack.grafana "grafana.ini" (dict "server" (dict "root_url" (printf "https://%s" .))) }}
{{- end }}
{{- end }}
# Wave 1: the Prometheus stack (kube-prometheus-stack). local: Prometheus,
# Alertmanager and Grafana. external: Prometheus in agent mode, which sends
# everything to the external Prometheus and keeps nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: {{ .Values.versions.kubePrometheusStack }}
    helm:
      releaseName: monitoring
      valuesObject:
        {{- toYaml (mustMergeOverwrite $stack (deepCopy $m.values)) | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {{ toJson $retry }}
    # The operator CRDs are too large for client-side apply.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Wave 2: CloudWatch metrics of the environment's RDS instance (YACE). It finds the
# instance by the tags the composition sets, so no instance name is configured.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-rds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: yet-another-cloudwatch-exporter
    targetRevision: {{ .Values.versions.yace }}
    helm:
      releaseName: yace
      valuesObject:
        fullnameOverride: yace
        testConnection: false
        serviceAccount:
          create: true
          name: yace
          annotations:
            eks.amazonaws.com/role-arn: {{ .Values.aws.cloudwatchExporterRoleArn }}
        serviceMonitor:
          enabled: true
          interval: 60s
          timeout: 30s
        config: |
          apiVersion: v1alpha1
          sts-region: {{ .Values.aws.region }}
          discovery:
            exportedTagsOnMetrics:
              AWS/RDS: [Environment]
            jobs:
            - type: AWS/RDS
              regions: [{{ .Values.aws.region }}]
              searchTags:
              - {key: Service, value: ^Datagrok$}
              - {key: Environment, value: ^{{ .Values.env }}$}
              period: 60
              length: 600
              delay: 120
              nilToZero: true
              metrics:
              - {name: CPUUtilization, statistics: [Average, Maximum]}
              - {name: FreeableMemory, statistics: [Minimum]}
              - {name: FreeStorageSpace, statistics: [Minimum]}
              - {name: DatabaseConnections, statistics: [Maximum]}
              - {name: ReadLatency, statistics: [Average]}
              - {name: WriteLatency, statistics: [Average]}
              - {name: ReadIOPS, statistics: [Average]}
              - {name: WriteIOPS, statistics: [Average]}
              - {name: DiskQueueDepth, statistics: [Average]}
              - {name: EBSIOBalance%, statistics: [Minimum]}
              - {name: ReplicaLag, statistics: [Maximum]}
              - {name: TransactionLogsDiskUsage, statistics: [Maximum]}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {{ toJson $retry }}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Wave 2: Datagrok rules and dashboards and the Grafana password (local), or the
# credentials of the external Prometheus (external).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-datagrok
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision }}
    path: gitops/charts/datagrok-monitoring
    helm:
      valuesObject:
        env: {{ .Values.env }}
        mode: {{ $mode }}
        alerts: {{ toJson $m.alerts }}
        remoteWriteAuth: {{ and (eq $mode "external") $m.external.basicAuth }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {{ toJson $retry }}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
{{- end }}
