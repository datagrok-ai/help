# env, repo and aws are filled in by Terraform (helm_release.root in
# terraform/main.tf) from the cluster that was built. Terraform also passes
# gitops/envs/<env>.yaml, which sets datagrok.version.
env: ""
repo:
  url: ""
  revision: main
aws:
  accountId: ""
  region: ""
  vpcId: ""
  vpcCidr: ""
  dbSubnetGroup: ""
  nodeSecurityGroupId: ""
  oidcProvider: ""
  clusterName: ""
  crossplaneRoleArn: ""
  lbControllerRoleArn: ""
  externalSecretsRoleArn: ""
  cloudwatchExporterRoleArn: ""

datagrok:
  # Version of the datagrok-env chart and the crossplane-aws package. Set it in
  # gitops/envs/<env>.yaml, so that each environment is released on its own.
  version: ""
  registry: registry-1.docker.io/datagrok
  # A chart path in this repo, e.g. gitops/charts/datagrok-env, to deploy a
  # modified copy of the environment chart instead of the published one.
  envChartPath: ""
  # false: install the XRD and composition from gitops/platform instead.
  crossplanePackage: true

# Set by Terraform (install_lb_controller): false when the cluster already runs one.
controllers:
  awsLoadBalancerController: true

# Optional monitoring, installed in the monitoring namespace. The mode comes from
# Terraform (monitoring_mode), because it decides the IAM role and the EBS driver;
# everything else is set in gitops/envs/<env>.yaml.
monitoring:
  # off: nothing is installed.
  # local: Prometheus, Alertmanager and Grafana in this cluster, with the Datagrok
  #   rules and dashboards. Only on a cluster that runs no other Prometheus operator.
  # external: a forwarder (the prometheus chart, 2 hours in memory) scrapes this
  #   cluster and remote-writes everything to an external Prometheus, which holds
  #   the data, the rules and the dashboards.
  # Both collect the CloudWatch metrics of the environment's RDS instance.
  mode: "off"
  # local: how long Prometheus keeps everything, including the hourly consumption
  # roll-ups, so this is also how far back consumption can be summed.
  retention: 31d
  storageSize: 100Gi
  grafana:
    # local: publish Grafana through the ALB on this hostname. Empty: kubectl port-forward only.
    hostname: ""
    certificateArn: ""
  alerts:
    rdsCpuPercent: 85
    rdsFreeStorageBytes: 5368709120
    rdsFreeableMemoryBytes: 268435456
    rdsIoBalancePercent: 20
  external:
    # The remote_write endpoint of the external Prometheus,
    # e.g. https://prometheus.example.com/api/v1/write
    url: ""
    # Basic auth: this username, and the password property of the Secrets Manager
    # secret datagrok/<env>/monitoring. Empty: no authentication.
    username: ""
    # Value of the cluster label on every series. Default: datagrok-<env>.
    cluster: ""
  # Deep-merged over the computed chart values: kube-prometheus-stack (local) or
  # prometheus (external).
  values: {}

versions:
  crossplane: 2.3.3
  externalSecrets: 2.6.0
  awsLoadBalancerController: 3.4.0
  kubePrometheusStack: 92.21.2
  prometheus: 29.12.0
  yace: 0.39.1
