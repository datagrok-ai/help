# Contract for gitops/envs/<env>.yaml. The defaults are the production
# profile; an env file usually sets only name, hostname and version.

env: ""                       # REQUIRED: short name, feeds every resource name
hostname: ""                  # REQUIRED: public hostname of this environment

# Filled in by the bootstrap chart from Terraform outputs. Do not set by hand.
aws: {}

datagrok:
  # The Datagrok chart. The published chart sets it to its own release; set it
  # only to run a different one, or when deploying this chart from Git.
  chartVersion: 1.27.6-helm

# Image of each service: a tag, or a sha256: digest that pins one build (a new
# digest in Git is a normal, revertible rollout). A service that isn't listed
# runs the default of the Datagrok chart above.
images: {}
#  datagrok: 1.28.1
#  grokConnect: 2.8.7
#  grokConnectAdbc:
#  grokConnectExtended:
#  grokPipe:
#  spawner:
#  rabbitmq:

# Safety switch. false: removing the environment keeps the database, the bucket
# and the log group in AWS, and the db/storage guards below can't be weakened.
# To delete the data: set true on its own, sync, then lower the guards.
allowDataDeletion: false

db:
  # RDS address, known after the first sync: kubectl get dge. The Datagrok
  # chart is not rendered until it is set.
  host: ""
  instanceClass: db.m7g.large
  engineVersion: "17.9"
  allocatedStorage: 100
  maxAllocatedStorage: 500
  multiAz: true
  deletionProtection: true
  skipFinalSnapshot: false
  backupRetentionDays: 35

storage:
  noncurrentVersionDays: 30
  forceDestroy: false

logging:
  retentionDays: 365

ingress:
  # Empty: the ALB controller finds an issued ACM certificate matching the hostname.
  certificateArn: ""

# Deep-merged over the computed Datagrok chart values; any chart value can be
# overridden per environment here.
appValues: {}
