{{- $name := include "env.name" . }}
{{- $keys := include "env.secretKeys" . | fromYamlArray }}
# Credentials: generated once in the cluster, pushed to Secrets Manager
# datagrok/<env> (the durable copy), and read back from there. No password
# is ever written to Git. Crossplane reads the RDS master password from the
# seed Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: datagrok-seed
  namespace: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 32
  digits: 8
  # RDS rejects '/', '@', '"' and spaces in the master password.
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
  {{- range $keys }}
  - {{ . }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datagrok-seed
  namespace: {{ $name }}
  annotations:
    # Re-creating it would generate new passwords that no longer match RDS.
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: datagrok-seed
    creationPolicy: Orphan
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: datagrok-seed
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: datagrok-seed
  namespace: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRefs:
  - name: aws-secrets-manager
    kind: ClusterSecretStore
  selector:
    secret:
      name: datagrok-seed
  updatePolicy: Replace
  # The Secrets Manager copy outlives the environment: it is the recovery source.
  deletionPolicy: None
  data:
  {{- range $keys }}
  - match:
      secretKey: {{ . }}
      remoteRef:
        remoteKey: datagrok/{{ $.Values.env }}
        property: {{ . }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datagrok-pg
  namespace: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: datagrok-pg
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
  - secretKey: pgPassword
    remoteRef:
      key: datagrok/{{ .Values.env }}
      property: pgPassword
