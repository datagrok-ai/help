# DatagrokEnvironment: one per cluster. Composed of the RDS instance and its
# security group, the S3 bucket, the IAM role of the Datagrok ServiceAccount,
# and the CloudWatch log group. The `aws` block carries the cluster facts that
# Terraform passed to the bootstrap chart.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: datagrokenvironments.platform.datagrok.ai
  annotations:
    # Deleting the XRD deletes every DatagrokEnvironment, so ArgoCD never removes it.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "3"
spec:
  scope: Cluster
  group: platform.datagrok.ai
  names:
    kind: DatagrokEnvironment
    plural: datagrokenvironments
    shortNames: [dge]
  defaultCompositionRef:
    name: datagrokenvironment-aws
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [env, aws]
            # Safety switch: a guard on the environment's data can be weakened only
            # once allowDataDeletion is ALREADY true on the stored object, so dropping
            # data always takes two separate syncs. One update doing both is rejected.
            x-kubernetes-validations:
            - rule: oldSelf.allowDataDeletion || self.db.deletionProtection || !oldSelf.db.deletionProtection
              message: db.deletionProtection can be turned off only after allowDataDeletion=true has synced
            - rule: oldSelf.allowDataDeletion || !self.db.skipFinalSnapshot || oldSelf.db.skipFinalSnapshot
              message: db.skipFinalSnapshot can be turned on only after allowDataDeletion=true has synced
            - rule: oldSelf.allowDataDeletion || self.db.backupRetentionDays >= oldSelf.db.backupRetentionDays
              message: db.backupRetentionDays can be lowered only after allowDataDeletion=true has synced
            - rule: oldSelf.allowDataDeletion || !self.storage.forceDestroy || oldSelf.storage.forceDestroy
              message: storage.forceDestroy can be turned on only after allowDataDeletion=true has synced
            - rule: oldSelf.allowDataDeletion || self.storage.noncurrentVersionDays >= oldSelf.storage.noncurrentVersionDays
              message: storage.noncurrentVersionDays can be lowered only after allowDataDeletion=true has synced
            properties:
              env:
                type: string
                pattern: '^[a-z][a-z0-9-]{1,20}$'
                # Every AWS resource name derives from it; a rename would orphan the data.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: env is immutable
              allowDataDeletion:
                type: boolean
                default: false
                description: >-
                  false: the RDS instance, the S3 bucket and its versioning, and the
                  log group are orphaned, never deleted, when the environment is
                  removed, and their guards can't be weakened. true: removal deletes
                  them; set it on its own and sync before lowering any guard.
              aws:
                type: object
                required: [accountId, region, vpcId, dbSubnetGroup, nodeSecurityGroupId, oidcProvider]
                properties:
                  accountId: {type: string}
                  region: {type: string}
                  vpcId: {type: string}
                  dbSubnetGroup: {type: string}
                  nodeSecurityGroupId: {type: string}
                  oidcProvider: {type: string}
              db:
                type: object
                default: {}
                properties:
                  instanceClass: {type: string, default: db.m7g.large}
                  engineVersion: {type: string, default: "17.9"}
                  allocatedStorage: {type: integer, default: 100}
                  maxAllocatedStorage: {type: integer, default: 500}
                  multiAz: {type: boolean, default: true}
                  deletionProtection: {type: boolean, default: true}
                  skipFinalSnapshot: {type: boolean, default: false}
                  backupRetentionDays: {type: integer, default: 35, minimum: 1, maximum: 35}
              storage:
                type: object
                default: {}
                properties:
                  noncurrentVersionDays: {type: integer, default: 30}
                  forceDestroy: {type: boolean, default: false}
              logging:
                type: object
                default: {}
                properties:
                  retentionDays: {type: integer, default: 365}
          status:
            type: object
            properties:
              dbEndpoint: {type: string}
              dbStatus: {type: string}
              bucket: {type: string}
              roleArn: {type: string}
    additionalPrinterColumns:
    - name: DB
      type: string
      jsonPath: .status.dbStatus
    - name: ENDPOINT
      type: string
      jsonPath: .status.dbEndpoint
    - name: READY
      type: string
      jsonPath: .status.conditions[?(@.type=='Ready')].status
